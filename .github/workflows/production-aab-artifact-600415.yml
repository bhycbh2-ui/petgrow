# Production-only manual upload artifact. This workflow never uploads to Google Play.
name: PetGrow Production AAB Artifact 600415

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-aab-artifact-600415.yml'

permissions:
  contents: read

jobs:
  build-production-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/petgrow-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Verify signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install pinned dependencies
        run: npm ci

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android release wiring
        run: node scripts/check-android-push-config.mjs

      - name: Normalize Android PNG resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image, ImageFile
          targets = [
              (Path('android/app/src/main/res/drawable-nodpi/petgrow_brand_icon.png'), False),
              (Path('android/app/src/main/res/drawable/splash.png'), True),
          ]
          for path, allow_truncated in targets:
              if not path.exists():
                  raise SystemExit(f'Missing Android PNG resource: {path}')
              ImageFile.LOAD_TRUNCATED_IMAGES = allow_truncated
              with Image.open(path) as image:
                  image.load()
                  image = image.convert('RGBA') if image.mode not in ('RGB', 'RGBA') else image.copy()
                  tmp = path.with_suffix('.normalized.png')
                  image.save(tmp, format='PNG', optimize=False, compress_level=6)
              os.replace(tmp, path)
              with Image.open(path) as check:
                  check.verify()
          PY

      - name: Prepare production signing and version
        id: release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION_CODE=600415
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          VERSION_NAME=$(sed -n -E 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_path=android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed production AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify signed AAB artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.release.outputs.aab_path }}"
          jarsigner -verify "${{ steps.release.outputs.aab_path }}"
          ls -lh "${{ steps.release.outputs.aab_path }}"

      - name: Upload production AAB artifact only
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-production-aab-${{ steps.release.outputs.version_code }}
          path: ${{ steps.release.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Production artifact summary
        shell: bash
        run: |
          {
            echo '## PetGrow production AAB artifact'
            echo ''
            echo '- Version name: `${{ steps.release.outputs.version_name }}`'
            echo '- Version code: `${{ steps.release.outputs.version_code }}`'
            echo '- Google Play upload: `NOT PERFORMED`'
            echo '- Intended track: `production (manual upload)`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary secrets
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH"
          rm -f android/app/google-services.json
