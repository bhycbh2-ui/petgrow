name: Diagnose Music Loading 20260817
on:
  push:
    paths:
      - '.music-loading-diag-trigger-20260817'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show music loading contexts
        run: |
          grep -n -C 12 'musicList\|loadMusic\|setMusic\|musicPage\|setPage.*music\|MusicPage\|PetMusic\|musicLoading\|music.*loading\|loading.*music' src/App.jsx | head -n 650 || true
          grep -n -C 12 '불러오는 중\|업로드 중\|업로드중' src/App.jsx | tail -n 320 || true
