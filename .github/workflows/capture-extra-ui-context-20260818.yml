name: Capture Extra UI Context 20260818
on:
  push:
    branches: [main]
    paths:
      - '.github/extra-ui-context-trigger-20260818.txt'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); lines=p.read_text(encoding='utf-8').splitlines(); out=[]
          for a,b in [(10660,10750),(10885,10925)]:
            out.append(f'--- {a}-{b} ---')
            out.extend(f'{n}: {lines[n-1]}' for n in range(a,min(b,len(lines))+1))
          # community feed definition context wherever it lives
          for needle in ['function CommunityFeed','const CommunityFeed','function TipsPage','const TipsPage']:
            for i,l in enumerate(lines):
              if needle in l:
                a=max(0,i-20);b=min(len(lines),i+120);out.append(f'--- {needle} {a+1}-{b} ---');out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('EXTRA_UI_CONTEXT_20260818.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add EXTRA_UI_CONTEXT_20260818.txt
          git commit -m 'chore: capture extra UI contexts' || exit 0
          git push origin main
