name: Apply Home Daily Content 20260819
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-home-daily-content-20260819.py'
      - 'scripts/trigger-home-daily-content-20260819.txt'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply dynamic home sections
        run: python3 scripts/apply-home-daily-content-20260819.py
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: add daily home recommendations music chart and news'
          git push origin main
