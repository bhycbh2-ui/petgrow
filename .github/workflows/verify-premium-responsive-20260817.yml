name: Verify Premium Responsive Design 20260817
on:
  push:
    branches: [work/design-unify-20260817]
    paths:
      - '.premium-responsive-trigger-20260817'
      - 'src/petgrow-premium-20260817.css'
      - 'src/main.jsx'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify responsive design import
        run: |
          grep -q 'petgrow-premium-20260817.css' src/main.jsx
          grep -q '@media (max-width:1024px)' src/petgrow-premium-20260817.css
          grep -q '@media (max-width:760px)' src/petgrow-premium-20260817.css
          grep -q '@media (max-width:390px)' src/petgrow-premium-20260817.css
