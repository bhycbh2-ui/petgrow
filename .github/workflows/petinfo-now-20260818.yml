name: PetInfo One-Time Update 2026-08-18
on:
  push:
    branches: [main]
    paths:
      - 'scripts/petinfo-now-20260818.mjs'
      - 'scripts/trigger-petinfo-now-20260818.txt'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Add PetInfo content
        run: node scripts/petinfo-now-20260818.mjs
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'content: add 16 PetInfo items for 2026-08-18'
          git push origin main
