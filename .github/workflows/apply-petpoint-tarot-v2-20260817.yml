name: Apply PetPoint and Premium Tarot V2 20260817
on:
  push:
    paths:
      - '.github/petpoint-tarot-v2-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply PetPoint backend and UI
        shell: bash
        run: |
          cat > server_lib/points.js <<'EOF'
          import crypto from "crypto";
          import { sql } from "@vercel/postgres";
          const START_POINTS=300;
          export const POINT_COSTS={saju_basic:50,saju_daily:20,saju_compat:40,tarot:30};
          const REASONS={welcome:{label:'PetGrow 시작 포인트',amount:300},daily_login:{label:'오늘의 첫 접속',amount:10,dailyCapCount:1},community_post:{label:'Pet톡 글 작성',amount:30,dailyCapCount:3},community_comment:{label:'Pet톡 댓글 작성',amount:10,dailyCapCount:10},received_like:{label:'Pet톡 좋아요 받기',amount:3,dailyCapCount:30}};
          const kstDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          async function ensure(){await sql`create table if not exists pg_point_accounts(user_id text primary key,balance integer not null default 0,created_at timestamptz not null default now(),updated_at timestamptz not null default now())`;await sql`create table if not exists pg_point_ledger(id text primary key,user_id text not null,amount integer not null,reason text not null,label text not null,ref_key text,created_at timestamptz not null default now())`;await sql`create unique index if not exists pg_point_ledger_ref_uidx on pg_point_ledger(user_id,ref_key) where ref_key is not null`;await sql`create index if not exists pg_point_ledger_user_idx on pg_point_ledger(user_id,created_at desc)`;}
          async function account(uid){await ensure();const {rows}=await sql`select balance from pg_point_accounts where user_id=${uid}`;if(rows[0])return Number(rows[0].balance)||0;await sql`insert into pg_point_accounts(user_id,balance) values(${uid},${START_POINTS}) on conflict do nothing`;await sql`insert into pg_point_ledger(id,user_id,amount,reason,label,ref_key) values(${crypto.randomUUID()},${uid},${START_POINTS},'welcome','PetGrow 시작 포인트','welcome') on conflict do nothing`;const {rows:r}=await sql`select balance from pg_point_accounts where user_id=${uid}`;return Number(r[0]?.balance)||START_POINTS;}
          export async function awardPoints(uid,reason,refKey){const cfg=REASONS[reason];if(!cfg)return {awarded:0,balance:await account(uid)};await account(uid);if(refKey){const {rows:d}=await sql`select 1 from pg_point_ledger where user_id=${uid} and ref_key=${refKey} limit 1`;if(d[0]){const {rows:b}=await sql`select balance from pg_point_accounts where user_id=${uid}`;return {awarded:0,balance:Number(b[0]?.balance)||0};}}if(cfg.dailyCapCount){const today=kstDate();const {rows:c}=await sql`select count(*)::int n from pg_point_ledger where user_id=${uid} and reason=${reason} and amount>0 and (created_at at time zone 'Asia/Seoul')::date=${today}::date`;if(Number(c[0]?.n||0)>=cfg.dailyCapCount){const {rows:b}=await sql`select balance from pg_point_accounts where user_id=${uid}`;return {awarded:0,balance:Number(b[0]?.balance)||0,capReached:true};}}try{await sql`insert into pg_point_ledger(id,user_id,amount,reason,label,ref_key) values(${crypto.randomUUID()},${uid},${cfg.amount},${reason},${cfg.label},${refKey||null})`;const {rows:b}=await sql`update pg_point_accounts set balance=balance+${cfg.amount},updated_at=now() where user_id=${uid} returning balance`;return {awarded:cfg.amount,balance:Number(b[0]?.balance)||0,label:cfg.label};}catch(e){if(String(e?.message||'').toLowerCase().includes('duplicate'))return {awarded:0,balance:await account(uid)};throw e;}}
          export async function revokePoints(uid,refKey,label='활동 삭제로 포인트 회수'){await account(uid);if(!refKey)return {revoked:0};const {rows:r}=await sql`select amount from pg_point_ledger where user_id=${uid} and ref_key=${refKey} and amount>0 limit 1`;const n=Number(r[0]?.amount)||0;if(!n)return {revoked:0};const rev='revoke:'+refKey;const {rows:d}=await sql`select 1 from pg_point_ledger where user_id=${uid} and ref_key=${rev} limit 1`;if(d[0])return {revoked:0};const {rows:b}=await sql`update pg_point_accounts set balance=greatest(0,balance-${n}),updated_at=now() where user_id=${uid} returning balance`;await sql`insert into pg_point_ledger(id,user_id,amount,reason,label,ref_key) values(${crypto.randomUUID()},${uid},${-n},'revoke',${label},${rev})`;return {revoked:n,balance:Number(b[0]?.balance)||0,label};}
          export async function spendPoints(uid,feature,cost,refKey){await account(uid);const n=Math.max(1,Number(cost)||POINT_COSTS[feature]||0);if(refKey){const {rows:d}=await sql`select 1 from pg_point_ledger where user_id=${uid} and ref_key=${refKey} limit 1`;if(d[0])return {spent:0,balance:await account(uid),already:true};}const {rows:b}=await sql`update pg_point_accounts set balance=balance-${n},updated_at=now() where user_id=${uid} and balance>=${n} returning balance`;if(!b[0]){const bal=await account(uid);const e=new Error(`PetPoint가 부족해요. 현재 ${bal}P 보유 중이에요.`);e.code='POINTS_INSUFFICIENT';throw e;}const labels={saju_basic:'기본 Pet사주 이용',saju_daily:'오늘의 펫운세 이용',saju_compat:'보호자 궁합 이용',tarot:'Pet타로 카드 뽑기'};await sql`insert into pg_point_ledger(id,user_id,amount,reason,label,ref_key) values(${crypto.randomUUID()},${uid},${-n},${feature},${labels[feature]||'PetGrow 콘텐츠 이용'},${refKey||null})`;return {spent:n,balance:Number(b[0].balance)||0,label:labels[feature]||'콘텐츠 이용'};}
          export async function getPointSummary(uid,{dailyLogin=true}={}){await account(uid);let loginEvent=null;if(dailyLogin)loginEvent=await awardPoints(uid,'daily_login',`daily-login:${kstDate()}`);const [{rows:b},{rows:l}]=await Promise.all([sql`select balance from pg_point_accounts where user_id=${uid}`,sql`select amount,reason,label,created_at from pg_point_ledger where user_id=${uid} order by created_at desc limit 20`]);return {balance:Number(b[0]?.balance)||0,startPoints:START_POINTS,costs:POINT_COSTS,recent:l,pointEvent:loginEvent?.awarded?loginEvent:null,earnGuide:[{label:'Pet톡 글 작성',points:30,limit:'하루 3회'},{label:'Pet톡 댓글 작성',points:10,limit:'하루 10회'},{label:'좋아요 받기',points:3,limit:'하루 30회'},{label:'하루 첫 접속',points:10,limit:'하루 1회'}]};}
          export async function getPointAdminStats(){await ensure();const [{rows:a},{rows:l}]=await Promise.all([sql`select count(*)::int users,coalesce(sum(balance),0)::int balance from pg_point_accounts`,sql`select coalesce(sum(case when amount>0 then amount else 0 end),0)::int earned,coalesce(sum(case when amount<0 then -amount else 0 end),0)::int spent,count(*)::int events from pg_point_ledger`]);return {...(a[0]||{}),...(l[0]||{})};}
          EOF

          cat > api/points.js <<'EOF'
          import { getSessionUserId } from '../server_lib/session.js';
          import { getAdminRole } from '../server_lib/admin.js';
          import { getPointSummary,getPointAdminStats,spendPoints,POINT_COSTS } from '../server_lib/points.js';
          export default async function handler(req,res){const uid=getSessionUserId(req);if(!uid)return res.status(401).json({error:'로그인이 필요해요.'});try{const action=String(req.query.action||'summary');if(req.method==='GET'&&action==='summary')return res.status(200).json(await getPointSummary(uid,{dailyLogin:true}));if(req.method==='GET'&&action==='admin'){const role=await getAdminRole(uid);if(!role)return res.status(403).json({error:'관리자 권한이 필요해요.'});return res.status(200).json(await getPointAdminStats());}if(req.method==='POST'&&action==='spend'){const feature=String(req.body?.feature||'');if(!['saju_basic','saju_daily','saju_compat'].includes(feature))return res.status(400).json({error:'지원하지 않는 포인트 사용 항목이에요.'});return res.status(200).json({ok:true,...await spendPoints(uid,feature,POINT_COSTS[feature],null)});}return res.status(405).json({error:'지원하지 않는 요청이에요.'});}catch(e){return res.status(e?.code==='POINTS_INSUFFICIENT'?402:500).json({error:e?.message||'PetPoint 처리 중 오류가 발생했어요.',code:e?.code||'POINT_ERROR'});}}
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('api/community.js'); s=p.read_text()
          if 'server_lib/points.js' not in s:
              s=s.replace('import { put } from "@vercel/blob";','import { put } from "@vercel/blob";\nimport { sql } from "@vercel/postgres";\nimport { awardPoints, revokePoints } from "../server_lib/points.js";')
          s=s.replace('return res.status(201).json(post);','const pointEvent = await awardPoints(uid,"community_post",`post:${post.id}`).catch(()=>null);\n        return res.status(201).json({ ...post, pointEvent });',1)
          s=s.replace('return res.status(200).json(await toggleLike({ postId: id, userId: uid }));','const likeResult=await toggleLike({ postId:id,userId:uid });\n      let pointEvent=null;\n      if(likeResult?.liked){const {rows:ownerRows}=await sql`select user_id from pg_posts where id=${id} limit 1`;const ownerId=ownerRows[0]?.user_id;if(ownerId&&ownerId!==uid)pointEvent=await awardPoints(ownerId,"received_like",`like-received:${id}:${uid}`).catch(()=>null);}\n      return res.status(200).json({ ...likeResult, pointEvent:null });')
          s=s.replace('return res.status(201).json(comment);','const pointEvent=await awardPoints(uid,"community_comment",`comment:${comment.id}`).catch(()=>null);\n        return res.status(201).json({ ...comment, pointEvent });',1)
          s=s.replace('const ok = await deletePost({ id, userId: uid });','const ok = await deletePost({ id, userId: uid });\n        if(ok) await revokePoints(uid,`post:${id}`,"Pet톡 글 삭제로 포인트 회수").catch(()=>{});',1)
          s=s.replace('const ok = await deleteComment({ id, userId: uid });','const ok = await deleteComment({ id, userId: uid });\n      if(ok) await revokePoints(uid,`comment:${id}`,"Pet톡 댓글 삭제로 포인트 회수").catch(()=>{});',1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('server_lib/tarot.js'); s=p.read_text()
          if './points.js' not in s:
              s=s.replace('import { getSessionUserId } from "./session.js";','import { getSessionUserId } from "./session.js";\nimport { spendPoints, POINT_COSTS } from "./points.js";')
          if 'const deepReading=' not in s:
              anchor='const clean=(v,max=120)=>String(v||"").trim().slice(0,max);'
              deep='''const deepReading=(topic,card,petName)=>{\n  const n=petName||"우리 아이", k=card.keyword;\n  const theme={daily:"오늘 하루의 전반적인 흐름",bond:"보호자와 우리 아이 사이의 교감",heart:"우리 아이가 오늘 느끼는 마음의 방향",activity:"산책·놀이·활동에서 드러나는 에너지",advice:"오늘 보호자가 기억하면 좋은 태도"}[topic]||"오늘의 흐름";\n  return {\n    overview:`${card.name} 카드는 전통적으로 ‘${k}’의 상징을 품고 있어요. ${n}의 ${theme}을 바라볼 때, 크게 밀어붙이기보다 현재 보이는 신호를 세심하게 읽는 것이 핵심이에요. ${card.meaning}`,\n    emotion:`${n}의 마음은 행동보다 작은 신호에서 먼저 드러날 수 있어요. 표정, 귀와 꼬리의 움직임, 쉬는 자리, 보호자에게 다가오는 방식처럼 평소와 다른 작은 변화를 천천히 살펴보세요.`,\n    bond:`보호자와의 관계에서는 정답을 정해두기보다 ${n}이 편안해하는 속도에 맞춰 반응해 주는 것이 좋아요. 짧은 눈맞춤, 부드러운 목소리, 익숙한 루틴이 오늘의 교감을 더 안정적으로 만들어줄 수 있어요.`,\n    activity:`활동은 컨디션을 확인하면서 강도를 조절해 주세요. 카드의 ‘${k}’ 흐름은 무조건 많이 움직이라는 뜻보다, ${n}에게 맞는 방식으로 경험의 질을 높이라는 메시지에 가까워요.`,\n    caution:`오늘은 타로 결과만으로 건강이나 행동 문제를 단정하지 않는 것이 중요해요. 평소와 다른 통증·식욕저하·무기력·호흡 이상처럼 실제 증상이 보이면 카드 해석보다 관찰과 수의학적 확인을 우선해 주세요.`,\n    action:`오늘의 실천 포인트는 “${card.tip}”예요. 거창하게 바꾸기보다 한 가지를 편안하게 실천해 보는 정도가 잘 어울려요.`,\n    closing:`${card.name}이 전하는 오늘의 한마디: ${n}의 속도를 존중하면서 ‘${k}’의 좋은 면을 생활 속 작은 선택으로 이어가 보세요.`\n  };\n};\n\n'''
              s=s.replace(anchor,deep+anchor)
          old='const card=deckFor(uid,petId,topic,today)[cardIndex],reading=topicReading(topic,card);\n    const result={cardId:card.id,key:card.key,name:card.name,en:card.en,symbol:card.symbol,keyword:card.keyword,meaning:card.meaning,tip:card.tip,luck:card.luck,topicKey:topic,topicLabel:reading.label,topicGuide:reading.guide,topicMeaning:reading.topicMeaning,topicTip:reading.topicTip};'
          new='const spendRef=`tarot-spend:${uid}:${petId}:${topic}:${today}`;\n    const pointEvent=await spendPoints(uid,"tarot",POINT_COSTS.tarot,spendRef);\n    const card=deckFor(uid,petId,topic,today)[cardIndex],reading=topicReading(topic,card),detail=deepReading(topic,card,petName);\n    const result={cardId:card.id,key:card.key,name:card.name,en:card.en,symbol:card.symbol,keyword:card.keyword,meaning:card.meaning,tip:card.tip,luck:card.luck,topicKey:topic,topicLabel:reading.label,topicGuide:reading.guide,topicMeaning:reading.topicMeaning,topicTip:reading.topicTip,...detail,pointCost:POINT_COSTS.tarot};'
          if old in s:s=s.replace(old,new)
          s=s.replace('return res.status(201).json({ok:true,id:row[0]?.id||id,date:today,result:row[0]?.result_json||result,saved:!!row[0]?.saved});','return res.status(201).json({ok:true,id:row[0]?.id||id,date:today,result:row[0]?.result_json||result,saved:!!row[0]?.saved,pointEvent});')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('src/PetDailyWidgets.jsx'); s=p.read_text()
          s=s.replace('window.setTimeout(()=>setPhase("focus"),1100);window.setTimeout(()=>setPhase("shuffle"),2400);window.setTimeout(()=>setPhase("choose"),4300);','window.setTimeout(()=>setPhase("focus"),1600);window.setTimeout(()=>setPhase("shuffle"),3600);window.setTimeout(()=>setPhase("choose"),6800);')
          s=s.replace('setPhase("reveal");window.setTimeout(()=>setPhase("result"),1800)},700)','setPhase("reveal");window.setTimeout(()=>setPhase("result"),2800)},1400)')
          if 'PETGROW_TAROT_PREMIUM_V2' not in s:
              s=s.replace('return <div className="feature-module-shell pet-tarot-shell">','return <div className="feature-module-shell pet-tarot-shell"><style>{`\n/* PETGROW_TAROT_PREMIUM_V2 */\n.pet-tarot-stage{background:radial-gradient(circle at 50% 0,#fffaf0 0,#fff 38%,#f8f4ec 100%)!important;border:1px solid #eadfca!important;box-shadow:0 20px 60px rgba(70,48,22,.08)!important}\n.pet-tarot-deck22{display:grid!important;grid-template-columns:repeat(11,minmax(42px,1fr))!important;gap:10px!important;transform:none!important;overflow:visible!important;padding:18px 4px 8px!important}\n.pet-tarot-back22{position:relative!important;inset:auto!important;transform:none!important;width:100%!important;aspect-ratio:2/3!important;min-height:112px!important;border-radius:13px!important;border:2px solid #c9a96a!important;background:linear-gradient(145deg,#20332d,#355248 58%,#1f302b)!important;box-shadow:0 8px 20px rgba(28,45,39,.18)!important;animation:tarotSpreadIn 1.15s cubic-bezier(.2,.75,.25,1) both!important;animation-delay:var(--delay)!important;color:#f6e5bb!important}\n.pet-tarot-back22:hover{transform:translateY(-12px) scale(1.055)!important;box-shadow:0 16px 28px rgba(28,45,39,.25)!important;border-color:#e2c583!important}\n.pet-tarot-back22 b{font-family:Georgia,serif!important;letter-spacing:.04em!important}.pet-tarot-back22 small{color:#ead8aa!important}.pet-tarot-back22 span{font-size:20px!important}.pet-tarot-back22 em{font-size:20px!important}\n.pet-tarot-shuffle-stack i{border:2px solid #c9a96a!important;background:linear-gradient(145deg,#20332d,#355248)!important;box-shadow:0 12px 32px rgba(30,48,42,.24)!important;animation-duration:2.8s!important}\n.pet-tarot-reveal-card{filter:drop-shadow(0 22px 30px rgba(45,35,20,.2))}.pet-tarot-reading-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.pet-tarot-reading-detail section{padding:16px;border:1px solid #eadfca;border-radius:16px;background:#fffdf8}.pet-tarot-reading-detail h4{margin:0 0 7px;font-size:13px;color:#6f5831}.pet-tarot-reading-detail p{margin:0;font-size:13px;line-height:1.75}.pet-tarot-reading-detail .wide{grid-column:1/-1}.pet-tarot-point-cost{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#fff5d9;color:#795b1f;font-size:11px;font-weight:900;margin-top:8px}\n@keyframes tarotSpreadIn{0%{opacity:0;transform:translateY(-18px) rotate(-4deg) scale(.88)}100%{opacity:1;transform:none}}\n@media(max-width:760px){.pet-tarot-deck22{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important}.pet-tarot-back22{min-height:126px!important}.pet-tarot-reading-detail{grid-template-columns:1fr}.pet-tarot-reading-detail .wide{grid-column:auto}}\n`}</style>')
          target='<div className="pet-tarot-reading"><span className="bg-chip active">{result.keyword}</span><h3>{result.topicLabel||currentTopic.label}</h3><p>{result.topicMeaning||result.meaning}</p><h3>우리 아이에게</h3><p>{result.topicTip||result.tip}</p><div className="pet-tarot-luck">🍀 오늘의 행운 포인트 <b>{result.luck}</b></div></div>'
          repl='<div className="pet-tarot-reading"><span className="bg-chip active">{result.keyword}</span><div className="pet-tarot-point-cost">🐾 PetPoint {result.pointCost||30}P 사용</div><h3>{result.topicLabel||currentTopic.label}</h3><p>{result.overview||result.topicMeaning||result.meaning}</p><div className="pet-tarot-reading-detail"><section><h4>💗 우리 아이의 마음</h4><p>{result.emotion||result.topicTip||result.tip}</p></section><section><h4>🤝 보호자와의 교감</h4><p>{result.bond||result.topicTip||result.tip}</p></section><section><h4>🌿 산책·놀이 흐름</h4><p>{result.activity||result.tip}</p></section><section><h4>🔎 오늘 살펴볼 점</h4><p>{result.caution||result.tip}</p></section><section className="wide"><h4>✨ 오늘의 실천</h4><p>{result.action||result.topicTip||result.tip}</p></section><section className="wide"><h4>🔮 카드가 전하는 한마디</h4><p>{result.closing||result.meaning}</p></section></div><div className="pet-tarot-luck">🍀 오늘의 행운 포인트 <b>{result.luck}</b></div></div>'
          if target in s:s=s.replace(target,repl)
          s=s.replace('const j=await jsonFetch("/api/tarot?action=draw",{method:"POST",body:JSON.stringify({petId,petName,topic,cardIndex:i})});','const j=await jsonFetch("/api/tarot?action=draw",{method:"POST",body:JSON.stringify({petId,petName,topic,cardIndex:i})});if(j.pointEvent?.spent)window.dispatchEvent(new CustomEvent("petgrow:points",{detail:{amount:-j.pointEvent.spent,balance:j.pointEvent.balance,label:j.pointEvent.label||"Pet타로 이용"}}));')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          # Generic point event dispatch for API responses such as PetTalk rewards.
          if 'petgrow:points' not in s[s.find('async function apiJson'):s.find('async function apiJson')+1200]:
              s=s.replace('  if (!res.ok) {','  if (data?.pointEvent?.awarded) window.dispatchEvent(new CustomEvent("petgrow:points", { detail:{ amount:data.pointEvent.awarded,balance:data.pointEvent.balance,label:data.pointEvent.label||"PetPoint 적립" } }));\n  if (data?.pointEvent?.spent) window.dispatchEvent(new CustomEvent("petgrow:points", { detail:{ amount:-data.pointEvent.spent,balance:data.pointEvent.balance,label:data.pointEvent.label||"PetPoint 사용" } }));\n  if (!res.ok) {',1)
          # Point helpers + visual cards.
          marker='function MyPage({ account, allPets, lang, onOpenAccount, onGoPets, onOpenPost, onOpenAdmin }) {'
          if 'function PetPointDashboard' not in s:
              block=r'''async function petPointSummary(){return apiJson("/api/points?action=summary");}
async function petPointSpend(feature){const r=await apiJson("/api/points?action=spend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({feature})});if(r?.spent)window.dispatchEvent(new CustomEvent("petgrow:points",{detail:{amount:-r.spent,balance:r.balance,label:r.label||"PetPoint 사용"}}));return r;}
