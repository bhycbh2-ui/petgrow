name: Apply PetGrow UI Fix V8 20260817

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-petgrow-ui-fix-v8-20260817.py'
      - '.github/workflows/apply-petgrow-ui-fix-v8-20260817.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python3 scripts/apply-petgrow-ui-fix-v8-20260817.py

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PetDailyWidgets.jsx api/music.js api/news.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: PetTalk music news admin and Tarot UX v8"
          git push origin main
