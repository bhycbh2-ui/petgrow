name: Inspect Final Batch V3 Targets
on:
  push:
    branches:
      - work/final-batch-20260818-v3
    paths:
      - '.github/inspect-v3-trigger.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/final-batch-20260818-v3
      - name: Capture target snippets
        run: |
          mkdir -p debug
          node scripts/inspect-targets-v3.mjs > debug/targets-v3.txt
      - name: Commit target snippets
        run: |
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add debug/targets-v3.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: capture final batch target snippets'
          git push origin work/final-batch-20260818-v3
