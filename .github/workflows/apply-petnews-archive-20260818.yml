name: Apply PetNews Archive 20260818
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-petnews-archive-20260818.mjs'
      - 'scripts/trigger-petnews-archive-20260818.txt'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply PetNews archive patch
        run: node scripts/apply-petnews-archive-20260818.mjs
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add api/news.js src/App.jsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: persist PetNews archive and paginate 20 per page'
          git push origin main
