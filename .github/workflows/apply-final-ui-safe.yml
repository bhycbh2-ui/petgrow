name: Apply Final UI Safe Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-ui-safe.mjs'
      - '.github/workflows/apply-final-ui-safe.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply safe UI patch
        run: node scripts/apply-final-ui-safe.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit verified UI changes and remove one-time patch files
        run: |
          git config user.name "PetGrow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/apply-final-ui-safe.yml scripts/apply-final-ui-safe.mjs
          git commit -m "ui: refine My Pets PetSaju and PetBTI layouts"
          git push origin main
