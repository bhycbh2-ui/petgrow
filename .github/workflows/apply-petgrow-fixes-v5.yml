name: Apply PetGrow Fixes V5
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-petgrow-fixes-v5.py'
      - 'scripts/trigger-petgrow-fixes-v5.txt'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install bundled map dependency
        run: npm install leaflet@1.9.4 --save
      - name: Apply fixes v5
        run: python3 scripts/apply-petgrow-fixes-v5.py
      - name: Verify server syntax
        run: node --check api/news.js
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx src/PetDailyWidgets.jsx api/news.js package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: repair PetTalk map news empty states about and tarot motion'
          git push origin main
