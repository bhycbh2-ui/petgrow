name: Fix Pet Tarot Korean Labels

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-tarot-korean-labels.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch Korean labels
        run: python3 scripts/fix-tarot-korean-labels.py
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/PetDailyWidgets.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep Pet Tarot Korean UI consistent'
          git push origin main
