name: Android AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
      - '.github/workflows/android-aab.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/petgrow-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Install Android push plugin for native sync
        run: npm install --no-save --package-lock=false @capacitor/push-notifications@6.0.2

      - name: Prepare Firebase Android configuration
        id: firebase
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            node -e "const f=require('./android/app/google-services.json'); if(!f.project_info?.project_id) process.exit(1); console.log('Firebase project:',f.project_info.project_id)"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; AAB will build but remote FCM delivery cannot be validated on-device."
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify native push plugin wiring
        shell: bash
        run: |
          grep -R "capacitor-push-notifications" android/capacitor.settings.gradle android/app/capacitor.build.gradle
          if [ "${{ steps.firebase.outputs.configured }}" = "true" ]; then
            test -s android/app/google-services.json
          fi

      - name: Prepare signing and version code
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION_CODE=$((600000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; building unsigned release artifact only."
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary secrets
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH"
          rm -f android/app/google-services.json
