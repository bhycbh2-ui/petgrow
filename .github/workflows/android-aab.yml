name: PetGrow Android Closed Alpha Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/check-android-push-config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
      - '.github/workflows/android-aab.yml'

permissions:
  contents: read

concurrency:
  group: petgrow-google-play-alpha
  cancel-in-progress: true

jobs:
  build-and-publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE_NAME: kr.co.petgrow.app
      PLAY_TRACK: alpha
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/petgrow-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Verify release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Google Play Alpha publishing is blocked until all required secrets are configured."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Install Android push plugin for native sync
        run: npm install --no-save --package-lock=false @capacitor/push-notifications@6.0.2

      - name: Prepare Firebase Android configuration
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            node -e "const f=require('./android/app/google-services.json'); if(!f.project_info?.project_id) process.exit(1); console.log('Firebase project:',f.project_info.project_id)"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; Alpha publishing can continue without FCM validation."
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android release wiring
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/check-android-push-config.mjs; then
            echo "::warning::Optional Android push wiring check is incomplete. This does not block Google Play Alpha publishing."
          fi
          if [ "${{ steps.firebase.outputs.configured }}" = "true" ]; then
            test -s android/app/google-services.json
          fi
          echo "Android release preflight complete."

      - name: Normalize Android PNG resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          targets = [
              Path('android/app/src/main/res/drawable-nodpi/petgrow_brand_icon.png'),
              Path('android/app/src/main/res/drawable/splash.png'),
          ]
          for path in targets:
              if not path.exists():
                  raise SystemExit(f'Missing Android PNG resource: {path}')
              original_size = path.stat().st_size
              with Image.open(path) as image:
                  image.load()
                  image = image.convert('RGBA') if image.mode not in ('RGB', 'RGBA') else image.copy()
                  tmp = path.with_suffix('.normalized.png')
                  image.save(tmp, format='PNG', optimize=False, compress_level=6)
              os.replace(tmp, path)
              with Image.open(path) as check:
                  check.verify()
              print(f'Normalized {path} ({original_size} -> {path.stat().st_size} bytes)')
          PY

      - name: Install Google Play API client
        run: npm install --no-save --package-lock=false googleapis@144.0.0

      - name: Prepare signing, version code, and release notes
        id: release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((600000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          VERSION_NAME=$(sed -n -E 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n1)

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          mkdir -p distribution/whatsnew
          python - <<'PY'
          import datetime
          import subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo

          date = datetime.datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d')
          raw = subprocess.check_output(['git','log','-5','--pretty=format:%s'], text=True).splitlines()
          items = [f'- {s.strip()}' for s in raw if s.strip()]
          body = f'PetGrow 업데이트 ({date})'
          if items:
              body += '\n' + '\n'.join(items)
          Path('distribution/whatsnew/whatsnew-ko-KR').write_text(body[:500], encoding='utf-8')
          print(body[:500])
          PY

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_path=android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify signed AAB artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.release.outputs.aab_path }}"
          ls -lh "${{ steps.release.outputs.aab_path }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-alpha-aab-${{ steps.release.outputs.version_code }}
          path: ${{ steps.release.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish AAB to Google Play closed Alpha
        id: play-publish
        shell: bash
        env:
          AAB_PATH: ${{ steps.release.outputs.aab_path }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { google } = require('googleapis');

          async function main() {
            const packageName = process.env.PACKAGE_NAME;
            const track = process.env.PLAY_TRACK || 'alpha';
            const aabPath = process.env.AAB_PATH;
            const expectedVersionCode = String(process.env.VERSION_CODE);
            const versionName = process.env.VERSION_NAME || 'release';
            const credentials = JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON);
            const notes = fs.readFileSync('distribution/whatsnew/whatsnew-ko-KR', 'utf8').slice(0, 500);

            if (!fs.existsSync(aabPath) || fs.statSync(aabPath).size === 0) {
              throw new Error(`AAB not found: ${aabPath}`);
            }

            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/androidpublisher'],
            });
            const androidpublisher = google.androidpublisher({ version: 'v3', auth });

            let editId;
            try {
              const edit = await androidpublisher.edits.insert({ packageName });
              editId = edit.data.id;
              if (!editId) throw new Error('Google Play did not return an edit id.');
              console.log(`Created Google Play edit ${editId}`);

              const bundle = await androidpublisher.edits.bundles.upload({
                packageName,
                editId,
                media: {
                  mimeType: 'application/octet-stream',
                  body: fs.createReadStream(aabPath),
                },
              });
              const uploadedVersionCode = String(bundle.data.versionCode ?? '');
              if (!uploadedVersionCode) throw new Error('Google Play did not return an uploaded versionCode.');
              if (uploadedVersionCode !== expectedVersionCode) {
                throw new Error(`Built versionCode ${expectedVersionCode} does not match uploaded versionCode ${uploadedVersionCode}.`);
              }
              console.log(`Uploaded AAB versionCode ${uploadedVersionCode}`);

              const releaseName = `PetGrow ${versionName} (${expectedVersionCode})`;
              await androidpublisher.edits.tracks.update({
                packageName,
                editId,
                track,
                requestBody: {
                  track,
                  releases: [{
                    name: releaseName,
                    versionCodes: [expectedVersionCode],
                    status: 'completed',
                    releaseNotes: [{ language: 'ko-KR', text: notes }],
                  }],
                },
              });
              console.log(`Assigned versionCode ${expectedVersionCode} to ${track}`);

              const committed = await androidpublisher.edits.commit({ packageName, editId });
              if (!committed.data.id) throw new Error('Google Play edit commit did not complete.');
              console.log(`Google Play ${track} release committed: ${releaseName}`);
            } catch (error) {
              if (editId) {
                try {
                  await androidpublisher.edits.delete({ packageName, editId });
                } catch (cleanupError) {
                  console.warn(`Could not delete failed edit ${editId}: ${cleanupError.message}`);
                }
              }
              const details = error?.response?.data ? JSON.stringify(error.response.data) : error?.stack || String(error);
              console.error(details);
              process.exitCode = 1;
            }
          }

          main();
          NODE

      - name: Closed Alpha release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## PetGrow Google Play closed Alpha release'
            echo ''
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Version name: \`${{ steps.release.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.release.outputs.version_code }}\`"
            echo "- Track: \`${PLAY_TRACK}\`"
            echo '- Status: `completed`'
            echo '- AAB: signed and uploaded automatically'
            echo '- Release notes: generated automatically from recent commits'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary secrets
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH"
          rm -f android/app/google-services.json
