name: Android AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/upload-google-play.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
      - '.github/workflows/android-aab.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAY_PACKAGE_NAME: kr.co.petgrow.app
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/petgrow-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ secrets.PLAY_TRACK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Play signing and version code
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION_CODE=$((600000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Play signing secrets are not configured yet; building unsigned release artifact only."
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetGrow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Check Google Play automation credentials
        id: play
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "$PLAY_TRACK" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Google Play upload skipped until signing + service-account + track secrets are configured."
          fi

      - name: Upload signed AAB to Google Play as draft
        if: steps.play.outputs.ready == 'true'
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          PLAY_RELEASE_NAME: PetGrow ${{ steps.signing.outputs.version_code }}
          PLAY_RELEASE_NOTES: PetGrow 기능 및 사용성 개선
        run: node scripts/upload-google-play.mjs

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
