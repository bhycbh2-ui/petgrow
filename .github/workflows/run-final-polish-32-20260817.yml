name: Run Final Polish 32 20260817
on:
  push:
    paths:
      - '.github/final-polish-32-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch target to 32 tracks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/final_polish_20260817.py')
          s=p.read_text()
          s=s.replace('need=max(0,36-len(refs))','need=max(0,32-len(refs))')
          s=s.replace('>=36','>=32')
          s=s.replace('<36','<32')
          p.write_text(s)
          PY
      - name: Apply final polish
        run: python .github/scripts/final_polish_20260817.py
      - name: Validate
        shell: bash
        run: |
          grep -q 'guide-premium-page' src/App.jsx
          grep -q 'effectiveView === "community"' src/App.jsx
          grep -q 'need=max(0,32-len(refs))' .github/scripts/final_polish_20260817.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add src/App.jsx api/points.js api/music.js src/PetDailyWidgets.jsx .github/scripts/final_polish_20260817.py
          git commit -m "feat: finalize premium guide PetTalk and 32-track music"
          git push
