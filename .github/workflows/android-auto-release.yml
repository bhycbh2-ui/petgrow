name: PetGrow Android Production Retry

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry-production-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PetGrow production releases now run automatically whenever Android-relevant code changes land on main."
          echo "This manual workflow is kept only as a retry control and intentionally has no schedule to prevent duplicate Play releases."
          gh workflow run android-aab.yml --ref main
