name: Apply Copy Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-copy-audit.mjs'
      - '.github/workflows/apply-copy-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip copy-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/apply-copy-audit.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PetGrow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: align legal numbering and guide copy with current features [skip copy-audit]"
          git push origin main
