name: Audit PetGrow About Design 20260817
on:
  push:
    branches: [work/design-unify-20260817]
    paths:
      - '.design-about-audit-trigger'
      - '.github/workflows/audit-design-about-20260817.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find design and map regions
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['src/App.jsx','src/PetDailyWidgets.jsx']
          terms=['타로 기록','타로기록','좋아요','마이페이지','회원정보','내 활동','HomePage','오늘의 우리 아이','PetGrow 소개','소개','setZoom','setView','fitBounds','panTo','setLevel','setCenter','invalidateSize','zoom','level','kakao.maps','leaflet','MapContainer']
          for fn in files:
            p=Path(fn)
            if not p.exists(): continue
            lines=p.read_text(encoding='utf-8').splitlines()
            print(f'\n===== FILE {fn} lines={len(lines)} =====')
            for term in terms:
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
              if not hits: continue
              print(f'\n### TERM {term} hits={hits[:30]}')
              for i in hits[:12]:
                lo=max(0,i-18); hi=min(len(lines),i+36)
                print(f'--- lines {lo+1}-{hi} ---')
                print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
