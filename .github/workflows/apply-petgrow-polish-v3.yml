name: Apply PetGrow Polish V3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-petgrow-polish-v3.py'
      - '.github/workflows/apply-petgrow-polish-v3.yml'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply polish v3
        run: python3 scripts/apply-petgrow-polish-v3.py
      - name: Verify server syntax
        run: node --check api/news.js && node --check server_lib/tarot.js
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx src/PetDailyWidgets.jsx api/news.js server_lib/tarot.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: polish menus guides news and tarot experience'
          git push origin main
