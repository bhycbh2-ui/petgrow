name: Apply Saju Loading Locale App 20260818
on:
  push:
    branches: [agent/saju-loading-locale-app-20260818]
    paths:
      - '.github/saju-loading-locale-app-trigger-20260818.txt'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saju-loading-locale-app-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested PetGrow fixes
        run: python scripts/apply-saju-loading-locale-app-20260818.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit verified changes to agent branch
        shell: bash
        run: |
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add src/App.jsx src/PetDailyWidgets.jsx src/main.jsx src/feature-unify-locale-20260818.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: sync Pet Saju loading locale and feature UI'
          git push origin agent/saju-loading-locale-app-20260818
