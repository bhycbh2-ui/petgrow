name: Apply Map and PetInfo Refinement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-map-petinfo-refine.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply refinement
        run: node scripts/apply-map-petinfo-refine.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: show nearby map and refine PetInfo Q&A colors"
            git push origin main
          fi
