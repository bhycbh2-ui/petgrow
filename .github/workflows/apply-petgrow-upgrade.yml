name: Apply PetGrow UX Upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-petnews-ui-fixed.mjs'
      - 'scripts/run-petgrow-upgrade.mjs'
      - '.github/workflows/apply-petgrow-upgrade.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply PetNews UI integration
        run: node scripts/apply-petnews-ui-fixed.mjs
      - name: Apply UX consistency bundle
        run: node scripts/run-petgrow-upgrade.mjs
      - name: Verify production web build
        run: npm run build
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx api/music.js
          git commit -m 'feat: unify PetGrow menus and improve home and nearby UX'
          git push origin main
