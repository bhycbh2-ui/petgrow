name: PetGrow Android Alpha Status

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/check-android-push-config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.*'
      - '.github/workflows/android-aab.yml'
      - '.github/workflows/android-alpha-status.yml'
  workflow_run:
    workflows:
      - PetGrow Android Closed Alpha Release
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish-status:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Android alpha commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            SHA="$GITHUB_SHA"
            STATE="pending"
            DESC="Building and publishing PetGrow AAB to Google Play alpha"
            TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/android-aab.yml"
          else
            SHA="$RUN_SHA"
            TARGET="$RUN_URL"
            case "$RUN_CONCLUSION" in
              success)
                STATE="success"
                DESC="PetGrow AAB published to Google Play alpha"
                ;;
              cancelled)
                STATE="error"
                DESC="PetGrow Android alpha release was cancelled"
                ;;
              *)
                STATE="failure"
                DESC="PetGrow Android alpha release failed"
                ;;
            esac
          fi

          python - <<'PY' "$STATE" "$DESC" "$TARGET" > /tmp/status.json
          import json,sys
          print(json.dumps({
            "state": sys.argv[1],
            "context": "PetGrow Android Alpha",
            "description": sys.argv[2],
            "target_url": sys.argv[3],
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d @/tmp/status.json
