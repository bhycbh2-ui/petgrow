name: PetGrow Phase 4 Verification

on:
  push:
    branches:
      - opt/phase4-capacitor7-20260828
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-android-push-config.mjs'
      - 'android/**'
      - '.github/workflows/android-aab.yml'
      - '.github/workflows/phase2-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Refresh lockfile for Capacitor 7 dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build web production bundle
        run: npm run build
      - name: Sync Android plugins
        run: npx cap sync android
      - name: Verify Android release wiring
        run: node scripts/check-android-push-config.mjs
      - name: Verify Android compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Security audit report
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock phase 4 Capacitor 7 dependencies'
          git push
