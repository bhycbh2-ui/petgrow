name: PetGrow Phase 5 Verification

on:
  push:
    branches:
      - opt/phase5-load-split-20260828
    paths:
      - 'src/**'
      - 'build/**'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-android-push-config.mjs'
      - 'scripts/report-app-functions.mjs'
      - 'android/**'
      - '.github/workflows/android-aab.yml'
      - '.github/workflows/phase2-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Report App.jsx function sizes
        run: node scripts/report-app-functions.mjs
      - name: Verify clean install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build web production bundle
        run: npm run build
      - name: Sync Android plugins
        run: npx cap sync android
      - name: Verify Android release wiring
        run: node scripts/check-android-push-config.mjs
      - name: Verify Android compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Security audit report
        continue-on-error: true
        run: npm audit --audit-level=high
