name: Build Consolidated PetGrow Fixes 20260817
on:
  push:
    branches: [work/full-fix-redesign-20260817]
    paths: ['.github/workflows/audit-full-fix-20260817.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply consolidated source fixes
        run: python .github/scripts/full_fix_20260817.py
      - name: Verify critical targets
        run: |
          grep -q 'PETGROW_FULL_FIX_REDESIGN_20260817' src/petgrow-premium-20260817.css
          grep -q 'Promise.allSettled' api/news.js
          grep -q 'map.setLevel(5)' src/App.jsx
          grep -q 'map.setView(c,14,{animate:false})' src/App.jsx
          grep -q 'key:"community"' src/App.jsx
          grep -q 'key:"news"' src/App.jsx
          grep -q 'key:"tarot"' src/App.jsx
          test ! -e api/auth/logout.js
          python - <<'PY'
          from pathlib import Path
          funcs=sorted(str(p) for p in Path('api').rglob('*.js'))
          print('API_JS_FILES',len(funcs),funcs)
          if len(funcs)>12: raise SystemExit('Vercel Hobby function limit exceeded')
          PY
      - name: Production build
        run: npm install && npm run build
      - name: Commit final work branch
        run: |
          rm -f .github/workflows/audit-full-fix-20260817.yml .github/workflows/finalize-full-fix-20260817.yml .github/scripts/full_fix_20260817.py
          git config user.name 'bhycbh2-ui'
          git config user.email 'bhycbh2@gmail.com'
          git add -A
          git commit -m 'fix: complete PetGrow navigation design and stability pass'
          git push origin HEAD:work/full-fix-redesign-20260817
