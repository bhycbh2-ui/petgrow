name: Audit PetGrow Full Fix 20260817
on:
  push:
    branches: [work/full-fix-redesign-20260817]
    paths: ['.github/workflows/audit-full-fix-20260817.yml', '.audit-full-fix-trigger']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect exact routing targets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text(encoding='utf-8')
          keys=['function Community','function PetNews','function Saju','function PetTarot','function Tarot','effectiveView ===','effectiveView===','view === "community"','view === "news"','view==="community"','view==="news"','case "community"','case "news"','newsList','newsLoading','communityList','<MyPage','my-menu-grid','tarotHistory','tarot-history','오늘의 Pet타로']
          for key in keys:
              print('\n###',key,'COUNT',s.count(key))
              start=0
              for n in range(6):
                  i=s.find(key,start)
                  if i<0: break
                  print('---',i,'---')
                  print(s[max(0,i-450):min(len(s),i+900)].replace('\r',''))
                  start=i+len(key)
          PY
      - name: Build baseline
        run: npm install && npm run build
