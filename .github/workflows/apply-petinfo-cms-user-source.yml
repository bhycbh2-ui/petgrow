name: Apply PetInfo CMS User Source

on:
  workflow_dispatch:
  push:
    branches:
      - agent/petinfo-cms-phase1
    paths:
      - '.github/triggers/petinfo-cms-user-source.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/petinfo-cms-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded PetInfo source patch
        run: node scripts/apply-petinfo-cms-user-source.mjs
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit only after tests and build pass
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes"
            exit 0
          fi
          git config user.name "petgrow-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: connect PetInfo screen to CMS with fallback"
          git push origin agent/petinfo-cms-phase1
