name: Run Final Polish 20260817
on:
  push:
    paths:
      - '.github/run-final-polish-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final polish
        run: python .github/scripts/final_polish_20260817.py
      - name: Validate
        run: |
          grep -q 'PETGROW_GUIDE_PREMIUM_20260817' src/App.jsx
          grep -q 'petmusic-starter-thirtysix-v5' api/music.js
          grep -q '>=36) return' api/music.js
      - name: Build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add src/App.jsx src/PetDailyWidgets.jsx api/points.js api/music.js
          git commit -m 'feat: premium guide PetTalk hardening and 36-track music set'
          git push
