name: PetInfo Daily Update 2026-08-20
on:
  push:
    branches:
      - automation/petinfo-20260820
    paths:
      - '.github/workflows/petinfo-daily-20260820.yml'
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/petinfo-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Add and validate PetInfo content
        run: node scripts/petinfo-daily-20260820.mjs
      - name: Production build
        run: npm run build
      - name: Commit generated PetInfo only after successful build
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'content: add 16 PetInfo items for 2026-08-20'
          git push origin automation/petinfo-20260820
