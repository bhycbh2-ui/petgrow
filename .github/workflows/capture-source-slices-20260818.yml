name: Capture Source Slices 20260818
on:
  push:
    branches: [main]
    paths:
      - '.github/source-slices-trigger-20260818.txt'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture source slices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          out=[]
          for fn,ranges in {
            'src/App.jsx':[(9080,9160),(9680,9790),(10545,10595),(10830,11080),(11645,11695)],
            'src/PetDailyWidgets.jsx':[(1,500)],
            'server_lib/db.js':[(1,260)],
          }.items():
            lines=Path(fn).read_text(encoding='utf-8').splitlines()
            out.append(f'===== {fn} =====')
            for a,b in ranges:
              out.append(f'--- {a}-{b} ---')
              for n in range(a,min(b,len(lines))+1): out.append(f'{n}: {lines[n-1]}')
          Path('FIX_SLICES_20260818.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit slices
        shell: bash
        run: |
          git config user.name petgrow-automation
          git config user.email actions@users.noreply.github.com
          git add FIX_SLICES_20260818.txt
          git commit -m 'chore: capture source slices for final batch' || exit 0
          git push origin main
