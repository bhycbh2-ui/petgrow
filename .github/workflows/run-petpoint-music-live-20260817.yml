name: Run PetPoint Music Live 20260817
on:
  push:
    branches:
      - work/petpoint-music-live-20260817
    paths:
      - '.petpoint-music-live-trigger-20260817'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/petpoint-music-live-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/scripts/petpoint_music_live_20260817.py
      - name: Validate
        run: |
          grep -q 'setInterval(()=>load(true),5000)' src/App.jsx || grep -q 'setInterval(()=>{if(alive)load()},5000)' src/App.jsx
          ! grep -A2 'action==="list"' api/music.js | grep -q 'ensureStarterTracks'
          grep -q 'action==="admin-seed"' api/music.js
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit changes to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx api/music.js
          git diff --cached --quiet && exit 0
          git commit -m 'perf: make PetPoint live and speed up Pet Music navigation'
          git push origin HEAD:work/petpoint-music-live-20260817
