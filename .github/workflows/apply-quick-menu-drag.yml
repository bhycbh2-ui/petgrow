name: Apply Quick Menu Drag

on:
  push:
    branches: [main]
    paths:
      - 'scripts/replace-quick-menu-drag.py'
      - '.github/triggers/quick-menu-drag.txt'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply drag reorder patch
        run: python3 scripts/replace-quick-menu-drag.py
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: polish quick menu drag ordering'
          git push origin main
