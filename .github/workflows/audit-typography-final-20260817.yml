name: Audit Typography Final 20260817
on:
  push:
    branches:
      - work/petpoint-music-live-20260817
    paths:
      - '.typography-final-audit-trigger-20260817'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
