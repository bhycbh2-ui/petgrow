name: Run News Image Enrich 20260817
on:
  push:
    branches:
      - work/petpoint-music-live-20260817
    paths:
      - '.news-image-enrich-trigger-20260817'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/petpoint-music-live-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/scripts/news_image_enrich_20260817.py
      - name: Validate
        run: grep -q 'const enriched=await enrichArticleImages(base)' api/news.js
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit changes to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/news.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enrich PetNews article images'
          git push origin HEAD:work/petpoint-music-live-20260817
