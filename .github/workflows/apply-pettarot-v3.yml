name: Apply Pet Tarot V3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-pettarot-v3.py'
      - '.github/triggers/pettarot-v3.txt'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Pet Tarot V3 patch
        run: python3 scripts/apply-pettarot-v3.py
      - name: Verify source syntax
        run: node --check server_lib/tarot.js
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx src/PetDailyWidgets.jsx server_lib/tarot.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: launch standalone topic-based Pet Tarot'
          git push origin main
