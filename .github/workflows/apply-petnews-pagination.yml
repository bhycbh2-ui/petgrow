name: Apply Pet News UX

on:
  push:
    branches: [main]
    paths:
      - 'scripts/replace-petnews-page-v2.mjs'
      - 'scripts/add-petnews-mobile-nav.mjs'
      - '.github/workflows/apply-petnews-pagination.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replace Pet News page safely
        run: node scripts/replace-petnews-page-v2.mjs
      - name: Add Pet News to mobile and app menus
        run: node scripts/add-petnews-mobile-nav.mjs
      - name: Verify production web build
        run: npm run build
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'petgrow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'feat: add Pet News search categories pagination and mobile nav'
          git push origin main
