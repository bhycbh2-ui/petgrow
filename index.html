<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="PetGrow - 반려동물 성장, 과학적인 계산으로 더 건강하게" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png?v=20260903-icon-fix" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=20260903-icon-fix" />
    <meta name="theme-color" content="#234f3c" />
    <title>PetGrow</title>

    <!--
      PetGrow 초기 스플래시
      React가 내려받아지기 전부터 먼저 표시되기 때문에 접속 직후의 빈 흰 화면을 가려줍니다.
      앱/모바일 웹/웹앱(PWA)/데스크톱 홈페이지에서 동일한 디자인을 사용합니다.
    -->
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #F8FAF7; }

      #petgrow-initial-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 34%, rgba(237,245,238,.82) 0%, rgba(248,250,247,0) 38%),
          linear-gradient(180deg, #FCFDFC 0%, #F8FAF7 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 320ms ease, visibility 320ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      #petgrow-initial-splash::before,
      #petgrow-initial-splash::after {
        content: "";
        position: absolute;
        bottom: -6vh;
        width: 60vw;
        height: 24vh;
        border-radius: 50% 50% 0 0;
        pointer-events: none;
      }

      #petgrow-initial-splash::before {
        left: -18vw;
        background: rgba(226,235,225,.55);
        transform: rotate(4deg);
      }

      #petgrow-initial-splash::after {
        right: -20vw;
        background: rgba(236,243,235,.72);
        transform: rotate(-5deg);
      }

      #petgrow-initial-splash.petgrow-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .petgrow-runners{position:absolute;left:0;right:0;bottom:max(6vh,42px);height:92px;overflow:hidden;pointer-events:none;z-index:1}
      .petgrow-runners:after{content:"";position:absolute;left:7%;right:7%;bottom:8px;height:1px;background:linear-gradient(90deg,transparent,rgba(79,138,91,.18),transparent)}
      .petgrow-runner{position:absolute;right:-100px;bottom:8px;width:72px;height:62px;filter:drop-shadow(0 6px 7px rgba(34,48,39,.09));will-change:transform}
      .petgrow-runner svg{width:100%;height:100%;overflow:visible}
      .petgrow-runner--dog{animation:petgrow-run-dog 4.6s linear infinite}
      .petgrow-runner--cat{animation:petgrow-run-cat 4.6s linear .92s infinite}
      .petgrow-runner__body{transform-origin:50% 65%;animation:petgrow-gallop .34s cubic-bezier(.45,0,.55,1) infinite alternate}
      .petgrow-leg--front{transform-origin:50% 15%;animation:petgrow-leg-front .34s ease-in-out infinite alternate}
      .petgrow-leg--back{transform-origin:50% 15%;animation:petgrow-leg-back .34s ease-in-out infinite alternate}
      .petgrow-tail{transform-origin:0 50%;animation:petgrow-tail .26s ease-in-out infinite alternate}
      .petgrow-speedline{animation:petgrow-speedline .55s ease-in-out infinite}
      @keyframes petgrow-run-dog{0%{transform:translate3d(120px,0,0)}12%{transform:translate3d(calc(-12vw + 90px),-4px,0)}25%{transform:translate3d(calc(-25vw + 60px),0,0)}38%{transform:translate3d(calc(-38vw + 30px),-5px,0)}50%{transform:translate3d(-50vw,0,0)}63%{transform:translate3d(calc(-63vw - 25px),-4px,0)}75%{transform:translate3d(calc(-75vw - 55px),0,0)}88%{transform:translate3d(calc(-88vw - 85px),-5px,0)}100%{transform:translate3d(calc(-100vw - 150px),0,0)}}
      @keyframes petgrow-run-cat{0%{transform:translate3d(145px,0,0) scale(.84)}12%{transform:translate3d(calc(-12vw + 105px),-6px,0) scale(.84)}25%{transform:translate3d(calc(-25vw + 70px),0,0) scale(.84)}38%{transform:translate3d(calc(-38vw + 35px),-7px,0) scale(.84)}50%{transform:translate3d(-50vw,0,0) scale(.84)}63%{transform:translate3d(calc(-63vw - 30px),-6px,0) scale(.84)}75%{transform:translate3d(calc(-75vw - 65px),0,0) scale(.84)}88%{transform:translate3d(calc(-88vw - 100px),-7px,0) scale(.84)}100%{transform:translate3d(calc(-100vw - 175px),0,0) scale(.84)}}
      @keyframes petgrow-gallop{from{transform:translateY(2px) scaleX(1.035) scaleY(.96) rotate(-1deg)}to{transform:translateY(-5px) scaleX(.97) scaleY(1.04) rotate(1deg)}}
      @keyframes petgrow-leg-front{from{transform:rotate(32deg) translateY(-1px)}to{transform:rotate(-38deg) translateY(1px)}}
      @keyframes petgrow-leg-back{from{transform:rotate(-34deg) translateY(1px)}to{transform:rotate(38deg) translateY(-1px)}}
      @keyframes petgrow-tail{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
      @keyframes petgrow-speedline{0%,100%{opacity:.12;transform:translateX(4px)}50%{opacity:.48;transform:translateX(-4px)}}
      @media(min-width:900px){.petgrow-runners{height:104px}.petgrow-runner{width:82px;height:70px}}

      .petgrow-splash__content {
        position: relative;
        z-index: 2;
        width: min(78vw, 320px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-2vh);
      }

      .petgrow-splash__logo-wrap {
        width: clamp(108px, 28vw, 148px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        animation: petgrow-logo-in 520ms cubic-bezier(.2,.75,.2,1) both;
      }

      .petgrow-splash__logo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 5px 12px rgba(34,48,39,.06));
      }

      .petgrow-splash__infographic {
        position: relative;
        width: clamp(190px, 51vw, 232px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 48%, rgba(255,255,255,.96) 0 34%, rgba(226,240,230,.8) 35% 36%, transparent 37%),
          linear-gradient(rgba(35,93,61,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(35,93,61,.045) 1px, transparent 1px),
          radial-gradient(circle, #f7fbf8 0%, #e8f2eb 72%, #dbe9df 100%);
        background-size: auto, 18px 18px, 18px 18px, auto;
        box-shadow:
          0 24px 58px rgba(28, 82, 53, .14),
          0 0 0 1px rgba(35, 92, 57, .08),
          0 0 0 12px rgba(214, 235, 218, .42);
        isolation: isolate;
        animation: petgrow-infographic-in 520ms cubic-bezier(.18,.82,.22,1) both;
      }

      .petgrow-splash__orbit {
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        border: 1px solid rgba(38,104,72,.2);
      }
      .petgrow-splash__orbit--outer {
        inset: 9%;
        border-style: dashed;
        animation: petgrow-orbit-spin 9s linear infinite;
      }
      .petgrow-splash__orbit--inner {
        inset: 24%;
        border-color: rgba(196,157,68,.28);
      }
      .petgrow-splash__orbit--outer::after,
      .petgrow-splash__orbit--inner::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2e7654;
        box-shadow: 0 0 0 5px rgba(46,118,84,.1);
      }
      .petgrow-splash__orbit--outer::after { right: 19%; top: 5%; }
      .petgrow-splash__orbit--inner::after { left: 4%; bottom: 24%; background: #c5a454; }

      .petgrow-splash__mark-wrap {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 50%;
        width: 43%;
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        transform: translate(-50%,-50%);
        animation: petgrow-mark-rise 760ms cubic-bezier(.18,.8,.2,1) 110ms both;
      }

      .petgrow-splash__mark {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 10px 18px rgba(16,65,43,.2));
      }

      .petgrow-splash__growth {
        position: absolute;
        z-index: 2;
        left: 11%;
        bottom: 13%;
        width: 78%;
        height: auto;
        overflow: visible;
      }
      .petgrow-splash__growth-guide {
        fill: none;
        stroke: rgba(35,106,77,.14);
        stroke-width: 2;
        stroke-dasharray: 4 6;
      }
      .petgrow-splash__growth-line {
        fill: none;
        stroke: #3f8a63;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 270;
        stroke-dashoffset: 270;
        animation: petgrow-growth-draw 860ms ease-out 260ms forwards;
      }
      .petgrow-splash__growth-dot {
        fill: #fff;
        stroke: #2d7957;
        stroke-width: 2;
        opacity: 0;
        animation: petgrow-growth-dot 220ms ease-out forwards;
      }
      .petgrow-splash__growth-dot--1 { animation-delay: .5s; }
      .petgrow-splash__growth-dot--2 { animation-delay: .72s; }
      .petgrow-splash__growth-dot--3 { animation-delay: .96s; fill: #d8bd76; stroke: #8f7336; }

      .petgrow-splash__data-label {
        position: absolute;
        z-index: 4;
        padding: 5px 7px;
        border: 1px solid rgba(35,106,77,.13);
        border-radius: 8px;
        background: rgba(255,255,255,.9);
        color: #5f7468;
        font: 800 8px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        letter-spacing: .08em;
        box-shadow: 0 7px 18px rgba(28,67,47,.07);
        opacity: 0;
        animation: petgrow-label-in 300ms ease-out forwards;
      }
      .petgrow-splash__data-label--record { left: -2%; top: 26%; animation-delay: .28s; }
      .petgrow-splash__data-label--care { right: -1%; top: 37%; animation-delay: .52s; }
      .petgrow-splash__data-label--grow { right: 7%; bottom: 8%; animation-delay: .78s; color: #296d4d; }

      .petgrow-splash__hello {
        margin: 22px 0 0;
        color: #173d2b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
        font-size: clamp(25px, 7vw, 31px);
        font-weight: 850;
        line-height: 1;
        letter-spacing: -.055em;
        animation: petgrow-copy-in 460ms ease-out 620ms both;
      }

      .petgrow-splash__hello b { color: #287047; }

      .petgrow-splash__tagline {
        margin: 10px 0 0;
        color: #5F6B63;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.03em;
        text-align: center;
      }

      .petgrow-splash__progress {
        width: min(54vw, 184px);
        height: 5px;
        margin-top: clamp(34px, 5vh, 46px);
        overflow: hidden;
        border-radius: 999px;
        background: #E2E9E3;
        box-shadow: inset 0 1px 2px rgba(34,48,39,.04);
      }

      .petgrow-splash__progress-bar {
        display: block;
        width: 12%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #A9C8AE 0%, #4F8A5B 100%);
        animation: petgrow-progress 1150ms cubic-bezier(.22,.72,.25,1) forwards;
      }

      .petgrow-splash__status {
        margin: 13px 0 0;
        color: #4D5C52;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.45;
        letter-spacing: -0.025em;
        text-align: center;
      }

      .petgrow-splash__dots {
        display: flex;
        gap: 7px;
        margin-top: 18px;
      }
      .petgrow-splash__dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #D2DDD4;
        animation: petgrow-dot 1.15s ease-in-out infinite;
      }
      .petgrow-splash__dot:nth-child(2) { animation-delay: .14s; }
      .petgrow-splash__dot:nth-child(3) { animation-delay: .28s; }

      @keyframes petgrow-logo-in {
        from { opacity: 0; transform: translateY(8px) scale(.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes petgrow-infographic-in {
        0% { opacity: 0; transform: scale(.78); }
        68% { opacity: 1; transform: scale(1.035); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes petgrow-mark-rise {
        0% { opacity: 0; transform: translate(-50%,-34%) scale(.78); }
        68% { opacity: 1; transform: translate(-50%,-53%) scale(1.035); }
        100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      }
      @keyframes petgrow-orbit-spin { to { transform: rotate(360deg); } }
      @keyframes petgrow-growth-draw { to { stroke-dashoffset: 0; } }
      @keyframes petgrow-growth-dot { to { opacity: 1; } }
      @keyframes petgrow-label-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes petgrow-copy-in {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes petgrow-progress {
        0% { width: 12%; }
        48% { width: 62%; }
        100% { width: 90%; }
      }
      @keyframes petgrow-dot {
        0%, 55%, 100% { background: #D2DDD4; transform: scale(.86); }
        25% { background: #4F8A5B; transform: scale(1); }
      }

      @media (orientation: landscape) and (max-height: 600px) {
        .petgrow-splash__content { transform: none; }
        .petgrow-splash__infographic { width: 132px; }
        .petgrow-splash__data-label { display: none; }
        .petgrow-splash__hello { margin-top: 11px; font-size: 22px; }
        .petgrow-splash__tagline { margin-top: 5px; font-size: 11px; }
        .petgrow-splash__progress { margin-top: 13px; width: 150px; }
        .petgrow-splash__status { margin-top: 8px; }
        .petgrow-splash__dots { margin-top: 10px; }
      }

      @media (min-width: 900px) {
        .petgrow-splash__infographic { width: 218px; }
        .petgrow-splash__progress { width: 190px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #petgrow-initial-splash { transition-duration: 120ms; }
        .petgrow-splash__infographic,
        .petgrow-splash__orbit,
        .petgrow-splash__mark-wrap,
        .petgrow-splash__growth-line,
        .petgrow-splash__growth-dot,
        .petgrow-splash__data-label,
        .petgrow-splash__hello,
        .petgrow-splash__progress-bar,
        .petgrow-splash__dot,
        .petgrow-runner { animation-duration: 1ms; animation-iteration-count: 1; }
        .petgrow-splash__progress-bar { width: 90%; }
      }
    </style>
    <script>
      window.__petgrowSplashShownAt = performance.now();
      window.__petgrowSplashSoundPlayed = false;

      window.__playPetGrowSplashSound = function () {
        if (window.__petgrowSplashSoundPlayed) return;
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        var isApp = /(?:^|[?&])app_version=/i.test(location.search);
        if (!isMobile && !isApp) return;
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume().catch(function(){});
          var now = ctx.currentTime;
          var gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.045, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          gain.connect(ctx.destination);
          [659.25, 783.99].forEach(function(freq, index) {
            var osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + index * 0.07);
            osc.connect(gain);
            osc.start(now + index * 0.07);
            osc.stop(now + 0.44);
          });
          window.__petgrowSplashSoundPlayed = true;
          window.setTimeout(function(){ try { ctx.close(); } catch(e){} }, 700);
        } catch (e) {}
      };

      window.setTimeout(window.__playPetGrowSplashSound, 80);
      document.addEventListener('touchstart', window.__playPetGrowSplashSound, { once: true, passive: true });

      window.__hidePetGrowSplash = function () {
        var elapsed = performance.now() - window.__petgrowSplashShownAt;
        var wait = Math.max(0, 1450 - elapsed);
        window.setTimeout(function () {
          var splash = document.getElementById('petgrow-initial-splash');
          if (!splash || splash.classList.contains('petgrow-splash--hide')) return;
          var bar = splash.querySelector('.petgrow-splash__progress-bar');
          if (bar) bar.style.width = '100%';
          window.setTimeout(function () {
            splash.classList.add('petgrow-splash--hide');
            window.setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 360);
          }, 120);
        }, wait);
      };
    </script>
  </head>
  <body>
    <div id="petgrow-initial-splash" role="status" aria-live="polite" aria-label="PetGrow 불러오는 중">
      <div class="petgrow-splash__content">
        <div class="petgrow-splash__infographic" aria-hidden="true">
          <span class="petgrow-splash__orbit petgrow-splash__orbit--outer"></span>
          <span class="petgrow-splash__orbit petgrow-splash__orbit--inner"></span>
          <span class="petgrow-splash__data-label petgrow-splash__data-label--record">RECORD</span>
          <span class="petgrow-splash__data-label petgrow-splash__data-label--care">CARE</span>
          <span class="petgrow-splash__data-label petgrow-splash__data-label--grow">GROW</span>
          <div class="petgrow-splash__mark-wrap">
            <img class="petgrow-splash__mark" src="/petgrow-brand-source.svg" alt="" width="512" height="512" fetchpriority="high" decoding="sync" />
          </div>
          <svg class="petgrow-splash__growth" viewBox="0 0 220 96">
            <path class="petgrow-splash__growth-guide" d="M8 82C48 78 58 60 91 65C127 70 137 42 165 48C186 52 196 29 212 12" />
            <path class="petgrow-splash__growth-line" d="M8 82C48 78 58 60 91 65C127 70 137 42 165 48C186 52 196 29 212 12" />
            <circle class="petgrow-splash__growth-dot petgrow-splash__growth-dot--1" cx="8" cy="82" r="4" />
            <circle class="petgrow-splash__growth-dot petgrow-splash__growth-dot--2" cx="91" cy="65" r="4" />
            <circle class="petgrow-splash__growth-dot petgrow-splash__growth-dot--3" cx="212" cy="12" r="5" />
          </svg>
        </div>
        <p class="petgrow-splash__hello">Pet<b>Grow</b></p>
        <p class="petgrow-splash__tagline">우리 아이의 건강한 성장을 함께</p>
        <div class="petgrow-splash__progress" aria-hidden="true"><span class="petgrow-splash__progress-bar"></span></div>
        <p class="petgrow-splash__status">잠시만 기다려주세요</p>
        <div class="petgrow-splash__dots" aria-hidden="true"><span class="petgrow-splash__dot"></span><span class="petgrow-splash__dot"></span><span class="petgrow-splash__dot"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js?v=20260901', { updateViaCache: 'none' })
            .then(function (registration) { return registration.update(); })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
