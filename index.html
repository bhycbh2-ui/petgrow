<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="PetGrow - 반려동물 성장, 과학적인 계산으로 더 건강하게" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png?v=20260903-icon-fix" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=20260903-icon-fix" />
    <meta name="theme-color" content="#234f3c" />
    <title>PetGrow</title>

    <!--
      PetGrow 초기 스플래시
      React가 내려받아지기 전부터 먼저 표시되기 때문에 접속 직후의 빈 흰 화면을 가려줍니다.
      앱/모바일 웹/웹앱(PWA)/데스크톱 홈페이지에서 동일한 디자인을 사용합니다.
    -->
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #F8FAF7; }

      #petgrow-initial-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 34%, rgba(237,245,238,.82) 0%, rgba(248,250,247,0) 38%),
          linear-gradient(180deg, #FCFDFC 0%, #F8FAF7 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 320ms ease, visibility 320ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      #petgrow-initial-splash::before,
      #petgrow-initial-splash::after {
        content: "";
        position: absolute;
        bottom: -6vh;
        width: 60vw;
        height: 24vh;
        border-radius: 50% 50% 0 0;
        pointer-events: none;
      }

      #petgrow-initial-splash::before {
        left: -18vw;
        background: rgba(226,235,225,.55);
        transform: rotate(4deg);
      }

      #petgrow-initial-splash::after {
        right: -20vw;
        background: rgba(236,243,235,.72);
        transform: rotate(-5deg);
      }

      #petgrow-initial-splash.petgrow-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .petgrow-runners{position:absolute;left:0;right:0;bottom:max(6vh,42px);height:92px;overflow:hidden;pointer-events:none;z-index:1}
      .petgrow-runners:after{content:"";position:absolute;left:7%;right:7%;bottom:8px;height:1px;background:linear-gradient(90deg,transparent,rgba(79,138,91,.18),transparent)}
      .petgrow-runner{position:absolute;right:-100px;bottom:8px;width:72px;height:62px;filter:drop-shadow(0 6px 7px rgba(34,48,39,.09));will-change:transform}
      .petgrow-runner svg{width:100%;height:100%;overflow:visible}
      .petgrow-runner--dog{animation:petgrow-run-dog 4.6s linear infinite}
      .petgrow-runner--cat{animation:petgrow-run-cat 4.6s linear .92s infinite}
      .petgrow-runner__body{transform-origin:50% 65%;animation:petgrow-gallop .34s cubic-bezier(.45,0,.55,1) infinite alternate}
      .petgrow-leg--front{transform-origin:50% 15%;animation:petgrow-leg-front .34s ease-in-out infinite alternate}
      .petgrow-leg--back{transform-origin:50% 15%;animation:petgrow-leg-back .34s ease-in-out infinite alternate}
      .petgrow-tail{transform-origin:0 50%;animation:petgrow-tail .26s ease-in-out infinite alternate}
      .petgrow-speedline{animation:petgrow-speedline .55s ease-in-out infinite}
      @keyframes petgrow-run-dog{0%{transform:translate3d(120px,0,0)}12%{transform:translate3d(calc(-12vw + 90px),-4px,0)}25%{transform:translate3d(calc(-25vw + 60px),0,0)}38%{transform:translate3d(calc(-38vw + 30px),-5px,0)}50%{transform:translate3d(-50vw,0,0)}63%{transform:translate3d(calc(-63vw - 25px),-4px,0)}75%{transform:translate3d(calc(-75vw - 55px),0,0)}88%{transform:translate3d(calc(-88vw - 85px),-5px,0)}100%{transform:translate3d(calc(-100vw - 150px),0,0)}}
      @keyframes petgrow-run-cat{0%{transform:translate3d(145px,0,0) scale(.84)}12%{transform:translate3d(calc(-12vw + 105px),-6px,0) scale(.84)}25%{transform:translate3d(calc(-25vw + 70px),0,0) scale(.84)}38%{transform:translate3d(calc(-38vw + 35px),-7px,0) scale(.84)}50%{transform:translate3d(-50vw,0,0) scale(.84)}63%{transform:translate3d(calc(-63vw - 30px),-6px,0) scale(.84)}75%{transform:translate3d(calc(-75vw - 65px),0,0) scale(.84)}88%{transform:translate3d(calc(-88vw - 100px),-7px,0) scale(.84)}100%{transform:translate3d(calc(-100vw - 175px),0,0) scale(.84)}}
      @keyframes petgrow-gallop{from{transform:translateY(2px) scaleX(1.035) scaleY(.96) rotate(-1deg)}to{transform:translateY(-5px) scaleX(.97) scaleY(1.04) rotate(1deg)}}
      @keyframes petgrow-leg-front{from{transform:rotate(32deg) translateY(-1px)}to{transform:rotate(-38deg) translateY(1px)}}
      @keyframes petgrow-leg-back{from{transform:rotate(-34deg) translateY(1px)}to{transform:rotate(38deg) translateY(-1px)}}
      @keyframes petgrow-tail{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
      @keyframes petgrow-speedline{0%,100%{opacity:.12;transform:translateX(4px)}50%{opacity:.48;transform:translateX(-4px)}}
      @media(min-width:900px){.petgrow-runners{height:104px}.petgrow-runner{width:82px;height:70px}}

      .petgrow-splash__content {
        position: relative;
        z-index: 2;
        width: min(78vw, 320px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-2vh);
      }

      .petgrow-splash__logo-wrap {
        width: clamp(108px, 28vw, 148px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        animation: petgrow-logo-in 520ms cubic-bezier(.2,.75,.2,1) both;
      }

      .petgrow-splash__logo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 5px 12px rgba(34,48,39,.06));
      }

      .petgrow-splash__story { position:relative; width:clamp(184px,50vw,220px); height:226px; isolation:isolate; }
      .petgrow-splash__pulse { position:absolute; left:50%; top:8px; width:142px; height:142px; border-radius:50%; transform:translateX(-50%) scale(.6); background:radial-gradient(circle,#fff 0 48%,rgba(218,234,220,.72) 49% 66%,transparent 67%); opacity:0; animation:petgrow-pulse-bloom 600ms cubic-bezier(.2,.85,.2,1) 650ms forwards; }
      .petgrow-splash__metric { position:absolute; z-index:4; left:50%; top:35px; width:88px; height:72px; transform:translateX(-50%) scale(.25); opacity:0; animation:petgrow-metric-bloom 560ms cubic-bezier(.16,1.25,.3,1) 650ms forwards; }
      .petgrow-splash__metric-heart { fill:#2f7954; }
      .petgrow-splash__metric-paw { fill:#fff; }
      .petgrow-splash__seed-to-growth { position:absolute; z-index:2; inset:0; width:100%; height:100%; overflow:visible; }
      .petgrow-splash__stem { fill:none; stroke:#3d835e; stroke-width:4; stroke-linecap:round; stroke-dasharray:132; stroke-dashoffset:132; animation:petgrow-stem-grow 620ms cubic-bezier(.35,.05,.28,1) 150ms forwards; }
      .petgrow-splash__leaf { fill:#79a986; opacity:0; transform-box:fill-box; transform-origin:bottom center; }
      .petgrow-splash__leaf--left { animation:petgrow-leaf-open 300ms cubic-bezier(.2,.9,.3,1) 480ms forwards; }
      .petgrow-splash__leaf--right { fill:#b6c98f; animation:petgrow-leaf-open 300ms cubic-bezier(.2,.9,.3,1) 570ms forwards; }
      .petgrow-splash__seed { transform-box:fill-box; transform-origin:center; animation:petgrow-seed-gather 420ms cubic-bezier(.3,.8,.25,1) both; }
      .petgrow-splash__seed--one { animation-delay:20ms; }
      .petgrow-splash__seed--two { animation-delay:80ms; }
      .petgrow-splash__seed--three { animation-delay:140ms; }
      .petgrow-splash__record-caption { position:absolute; left:50%; bottom:0; transform:translateX(-50%); color:#718078; font-size:10px; font-weight:750; letter-spacing:.08em; white-space:nowrap; animation:petgrow-caption-in 300ms ease-out 180ms both; }

      .petgrow-splash__hello {
        margin: 8px 0 0;
        color: #173d2b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
        font-size: clamp(25px, 7vw, 31px);
        font-weight: 850;
        line-height: 1;
        letter-spacing: -.055em;
        animation: petgrow-copy-in 420ms ease-out 900ms both;
      }

      .petgrow-splash__hello b { color: #287047; }

      .petgrow-splash__tagline {
        margin: 9px 0 0;
        color: #5F6B63;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.03em;
        text-align: center;
      }

      .petgrow-splash__progress {
        width: min(54vw, 184px);
        height: 5px;
        margin-top: clamp(24px, 4vh, 36px);
        overflow: hidden;
        border-radius: 999px;
        background: #E2E9E3;
        box-shadow: inset 0 1px 2px rgba(34,48,39,.04);
      }

      .petgrow-splash__progress-bar {
        display: block;
        width: 12%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #A9C8AE 0%, #4F8A5B 100%);
        animation: petgrow-progress 1150ms cubic-bezier(.22,.72,.25,1) forwards;
      }

      .petgrow-splash__status { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

      @keyframes petgrow-logo-in {
        from { opacity: 0; transform: translateY(8px) scale(.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes petgrow-pulse-bloom { 0%{opacity:0;transform:translateX(-50%) scale(.55)} 70%{opacity:1;transform:translateX(-50%) scale(1.08)} 100%{opacity:.86;transform:translateX(-50%) scale(1)} }
      @keyframes petgrow-metric-bloom { 0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-8deg)} 68%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(2deg)} 100%{opacity:1;transform:translateX(-50%) scale(1)} }
      @keyframes petgrow-stem-grow { to { stroke-dashoffset:0; } }
      @keyframes petgrow-leaf-open { from{opacity:0;transform:scale(.1) rotate(-12deg)} to{opacity:1;transform:scale(1) rotate(0)} }
      @keyframes petgrow-seed-gather { 0%{opacity:0;transform:translateY(9px) scale(.5)} 55%{opacity:1;transform:translateY(0) scale(1.18)} 100%{opacity:1;transform:translateY(0) scale(1)} }
      @keyframes petgrow-caption-in { from{opacity:0;transform:translate(-50%,5px)} to{opacity:1;transform:translate(-50%,0)} }
      @keyframes petgrow-copy-in {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes petgrow-progress {
        0% { width: 12%; }
        48% { width: 62%; }
        100% { width: 90%; }
      }
      @media (orientation: landscape) and (max-height: 600px) {
        .petgrow-splash__content { transform: none; }
        .petgrow-splash__story { width:138px; height:150px; }
        .petgrow-splash__pulse { width:92px; height:92px; top:0; }
        .petgrow-splash__metric { width:58px; height:48px; top:16px; }
        .petgrow-splash__hello { margin-top: 11px; font-size: 22px; }
        .petgrow-splash__tagline { margin-top: 5px; font-size: 11px; }
        .petgrow-splash__progress { margin-top: 13px; width: 150px; }
      }

      @media (min-width: 900px) {
        .petgrow-splash__story { width:220px; }
        .petgrow-splash__progress { width: 190px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #petgrow-initial-splash { transition-duration: 120ms; }
        .petgrow-splash__pulse,
        .petgrow-splash__metric,
        .petgrow-splash__stem,
        .petgrow-splash__leaf,
        .petgrow-splash__seed,
        .petgrow-splash__record-caption,
        .petgrow-splash__hello,
        .petgrow-splash__progress-bar,
        .petgrow-runner { animation-duration: 1ms; animation-iteration-count: 1; }
        .petgrow-splash__progress-bar { width: 90%; }
      }
    </style>
    <script>
      window.__petgrowSplashShownAt = performance.now();
      window.__petgrowSplashSoundPlayed = false;

      window.__playPetGrowSplashSound = function () {
        if (window.__petgrowSplashSoundPlayed) return;
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        var isApp = /(?:^|[?&])app_version=/i.test(location.search);
        if (!isMobile && !isApp) return;
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume().catch(function(){});
          var now = ctx.currentTime;
          var gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.045, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          gain.connect(ctx.destination);
          [659.25, 783.99].forEach(function(freq, index) {
            var osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + index * 0.07);
            osc.connect(gain);
            osc.start(now + index * 0.07);
            osc.stop(now + 0.44);
          });
          window.__petgrowSplashSoundPlayed = true;
          window.setTimeout(function(){ try { ctx.close(); } catch(e){} }, 700);
        } catch (e) {}
      };

      window.setTimeout(window.__playPetGrowSplashSound, 80);
      document.addEventListener('touchstart', window.__playPetGrowSplashSound, { once: true, passive: true });

      window.__hidePetGrowSplash = function () {
        var elapsed = performance.now() - window.__petgrowSplashShownAt;
        var wait = Math.max(0, 1450 - elapsed);
        window.setTimeout(function () {
          var splash = document.getElementById('petgrow-initial-splash');
          if (!splash || splash.classList.contains('petgrow-splash--hide')) return;
          var bar = splash.querySelector('.petgrow-splash__progress-bar');
          if (bar) bar.style.width = '100%';
          window.setTimeout(function () {
            splash.classList.add('petgrow-splash--hide');
            window.setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 360);
          }, 120);
        }, wait);
      };
    </script>
  </head>
  <body>
    <div id="petgrow-initial-splash" role="status" aria-live="polite" aria-label="PetGrow 불러오는 중">
      <div class="petgrow-splash__content">
        <div class="petgrow-splash__story" aria-hidden="true">
          <span class="petgrow-splash__pulse"></span>
          <svg class="petgrow-splash__metric" viewBox="0 0 88 72">
            <path class="petgrow-splash__metric-heart" d="M44 68C39 61 11 45 8 25C5 8 25 0 36 13L44 23L52 13C63 0 83 8 80 25C77 45 49 61 44 68Z" />
            <ellipse class="petgrow-splash__metric-paw" cx="44" cy="39" rx="13" ry="10" />
            <circle class="petgrow-splash__metric-paw" cx="29" cy="28" r="5" />
            <circle class="petgrow-splash__metric-paw" cx="40" cy="23" r="5" />
            <circle class="petgrow-splash__metric-paw" cx="52" cy="24" r="5" />
            <circle class="petgrow-splash__metric-paw" cx="61" cy="31" r="5" />
          </svg>
          <svg class="petgrow-splash__seed-to-growth" viewBox="0 0 220 226">
            <path class="petgrow-splash__stem" d="M110 205C110 177 106 150 110 126C113 108 110 94 110 82" />
            <path class="petgrow-splash__leaf petgrow-splash__leaf--left" d="M108 160C82 161 73 147 73 133C90 133 105 141 108 160Z" />
            <path class="petgrow-splash__leaf petgrow-splash__leaf--right" d="M112 139C136 138 144 125 144 112C128 113 114 121 112 139Z" />
            <circle class="petgrow-splash__seed petgrow-splash__seed--one" cx="96" cy="207" r="5" fill="#b7caac" />
            <circle class="petgrow-splash__seed petgrow-splash__seed--two" cx="110" cy="207" r="6" fill="#327a55" />
            <circle class="petgrow-splash__seed petgrow-splash__seed--three" cx="125" cy="207" r="4" fill="#c6a654" />
          </svg>
          <span class="petgrow-splash__record-caption">기록 · 돌봄 · 성장</span>
        </div>
        <p class="petgrow-splash__hello">Pet<b>Grow</b></p>
        <p class="petgrow-splash__tagline">하루의 기록이 건강한 성장으로</p>
        <div class="petgrow-splash__progress" aria-hidden="true"><span class="petgrow-splash__progress-bar"></span></div>
        <p class="petgrow-splash__status">잠시만 기다려주세요</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js?v=20260901', { updateViaCache: 'none' })
            .then(function (registration) { return registration.update(); })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
