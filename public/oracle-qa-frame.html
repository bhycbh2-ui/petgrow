<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* PetGrow Premium Responsive Design System — 2026-08-17 */
:root{
  --pg-bg:#f7f5ef;
  --pg-bg-soft:#fbfaf7;
  --pg-surface:#ffffff;
  --pg-surface-soft:#f4f7f1;
  --pg-surface-warm:#fbf7ef;
  --pg-text:#25312a;
  --pg-text-2:#56625a;
  --pg-text-3:#7a837d;
  --pg-line:#e3e7e1;
  --pg-line-strong:#d6ddd4;
  --pg-primary:#315f40;
  --pg-primary-2:#477a55;
  --pg-primary-soft:#edf5ee;
  --pg-shadow:0 12px 34px rgba(47,67,54,.075);
  --pg-shadow-sm:0 6px 18px rgba(47,67,54,.055);
  --pg-radius-xl:28px;
  --pg-radius-lg:22px;
  --pg-radius-md:16px;
  --pg-radius-sm:12px;
  --pg-max:1180px;
}
html{background:var(--pg-bg);scroll-behavior:smooth}
body{margin:0;background:var(--pg-bg)!important;color:var(--pg-text)!important;font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit}
button{letter-spacing:-.01em}
*{box-sizing:border-box}

/* Global page rhythm */
main,.page,.page-wrap,.content,.content-wrap,.app-content,.main-content,.view-content{max-width:var(--pg-max);margin-left:auto!important;margin-right:auto!important}
.page,.page-wrap,.content-wrap,.app-content,.main-content,.view-content{padding-left:24px;padding-right:24px}
section{scroll-margin-top:90px}

/* Typography scale */
h1,h2,h3,h4,h5,h6{color:var(--pg-text);font-family:inherit!important;letter-spacing:-.035em;margin-top:0}
h1{font-size:clamp(30px,4vw,52px);line-height:1.08;font-weight:800}
h2{font-size:clamp(24px,3vw,34px);line-height:1.18;font-weight:800}
h3{font-size:20px;line-height:1.3;font-weight:700}
h4{font-size:17px;line-height:1.35;font-weight:700}
p,li,dd,dt,label{line-height:1.65}
small,.muted,.sub,.helper,.caption{color:var(--pg-text-3)}

/* Surfaces / cards */
.card,.bg-card,.panel,.box,.section-card,.feature-card,.info-card,.mypage-card,.activity-card,.profile-card,.pet-card,.admin-card,.stat-card{background:var(--pg-surface)!important;border:1px solid var(--pg-line)!important;border-radius:var(--pg-radius-lg)!important;box-shadow:var(--pg-shadow-sm)!important}
.card:hover,.feature-card:hover,.info-card:hover,.pet-card:hover{border-color:var(--pg-line-strong)!important;box-shadow:var(--pg-shadow)!important}

/* Buttons */
.bg-btn,.btn,.button,button.primary,.primary-btn,.cta-btn{min-height:42px;border-radius:14px!important;font-size:14px!important;font-weight:700!important;padding:10px 16px!important;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
.bg-btn:not(.bg-btn-ghost),.btn-primary,.primary-btn,.cta-btn,button.primary{background:var(--pg-primary)!important;border-color:var(--pg-primary)!important;color:#fff!important;box-shadow:0 7px 18px rgba(49,95,64,.18)}
.bg-btn:hover,.btn:hover,.button:hover{transform:translateY(-1px)}
.bg-btn-ghost,.btn-ghost,.secondary-btn{background:#fff!important;border:1px solid var(--pg-line-strong)!important;color:var(--pg-text)!important;box-shadow:none!important}

/* Inputs */
input,textarea,select,.bg-input{background:#fff!important;border:1px solid var(--pg-line-strong)!important;border-radius:14px!important;color:var(--pg-text)!important;box-shadow:none!important;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,textarea:focus,select:focus,.bg-input:focus{border-color:#8eae95!important;box-shadow:0 0 0 4px rgba(71,122,85,.09)!important}

/* Header / navigation */
header,.header,.topbar,.app-header,.site-header{background:rgba(247,245,239,.93)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(210,217,209,.75)!important;box-shadow:none!important}
nav a,.nav-item,.menu-item,.top-menu button,.mobile-menu button{font-size:14px!important;font-weight:600!important;color:var(--pg-text-2)!important;border-radius:12px}
nav a.active,.nav-item.active,.menu-item.active,.top-menu button.active,.mobile-menu button.active{color:var(--pg-primary)!important;background:var(--pg-primary-soft)!important}

/* Hero / introduction */
.hero,.home-hero,.about-hero,.intro-hero,.petnews-hero{border:1px solid var(--pg-line)!important;border-radius:32px!important;background:linear-gradient(135deg,#fffdf9 0%,#f1f6ef 58%,#eef5f3 100%)!important;box-shadow:var(--pg-shadow)!important;overflow:hidden}
.hero p,.home-hero p,.about-hero p,.intro-hero p{color:var(--pg-text-2)!important;font-size:15px!important;line-height:1.75!important}

/* Premium section spacing */
.about-section,.home-section,.feature-section,.info-section,.service-section{margin-top:32px!important;margin-bottom:32px!important}
.about-feature-grid,.about-features-grid,.intro-feature-grid,.intro-features-grid,.feature-grid,.service-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:18px!important}
.about-feature-grid>*,.about-features-grid>*,.intro-feature-grid>*,.intro-features-grid>*,.feature-grid>*,.service-grid>*{border-radius:24px!important;border:1px solid var(--pg-line)!important;background:#fff!important;box-shadow:var(--pg-shadow-sm)!important;padding:24px!important}
.about-feature-grid>*:nth-child(4n+1),.feature-grid>*:nth-child(4n+1){background:#eef6ef!important}
.about-feature-grid>*:nth-child(4n+2),.feature-grid>*:nth-child(4n+2){background:#faf6ed!important}
.about-feature-grid>*:nth-child(4n+3),.feature-grid>*:nth-child(4n+3){background:#eef6f5!important}
.about-feature-grid>*:nth-child(4n),.feature-grid>*:nth-child(4n){background:#fbf1ed!important}

/* Home */
.home-page,.home-wrap,.home-container{background:transparent!important}
.home-grid,.dashboard-grid,.quick-grid{gap:16px!important}
.home-card,.quick-card,.dashboard-card{border-radius:22px!important;border:1px solid var(--pg-line)!important;box-shadow:var(--pg-shadow-sm)!important}

/* My page / activity consistency */
.mypage-tabs,.activity-tabs,.profile-tabs,.member-tabs{display:flex!important;flex-wrap:wrap!important;gap:8px!important;padding:6px!important;background:#eef1ec!important;border-radius:16px!important}
.mypage-tabs button,.activity-tabs button,.profile-tabs button,.member-tabs button,.mypage-tab,.activity-tab,.profile-tab,.member-tab{background:transparent!important;color:var(--pg-text-2)!important;border:0!important;border-radius:11px!important;min-height:38px!important;padding:9px 13px!important;font-size:13px!important;font-weight:700!important;box-shadow:none!important}
.mypage-tabs button.active,.activity-tabs button.active,.profile-tabs button.active,.member-tabs button.active,.mypage-tab.active,.activity-tab.active,.profile-tab.active,.member-tab.active{background:var(--pg-primary)!important;color:#fff!important;box-shadow:0 5px 13px rgba(49,95,64,.16)!important}
/* Any isolated white activity buttons should blend with the same tab system */
.mypage button[aria-selected="false"],.member-page button[aria-selected="false"],.profile-page button[aria-selected="false"]{background:transparent!important;color:var(--pg-text-2)!important;box-shadow:none!important}
.mypage button[aria-selected="true"],.member-page button[aria-selected="true"],.profile-page button[aria-selected="true"]{background:var(--pg-primary)!important;color:#fff!important}

/* PetTalk / Info / News / Music */
.community-page,.pettalk-page,.petinfo-page,.petnews-v10,.music-page,.petmusic-page{max-width:var(--pg-max);margin:0 auto}
.community-list>*,.pettalk-list>*,.info-list>*,.music-list>*{border-color:var(--pg-line)!important;border-radius:18px!important}
.petnews-grid{gap:18px!important}.petnews-card-v10{border:1px solid var(--pg-line)!important;border-radius:22px!important;box-shadow:var(--pg-shadow-sm)!important;overflow:hidden;background:#fff!important}
.petnews-card-v10 img,.news-card img{aspect-ratio:16/9;object-fit:cover}

/* Forms / modals */
.modal,.dialog,.popup,.sheet,.modal-card,.popup-card{border:1px solid var(--pg-line)!important;border-radius:26px!important;background:#fff!important;box-shadow:0 24px 70px rgba(35,50,40,.18)!important}
.modal-backdrop,.popup-backdrop{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

/* Maps — fixed container geometry prevents apparent grow/shrink */
.map-wrap,.map-container,.nearby-map,.leaflet-container,[id*="map"]{border-radius:22px!important;overflow:hidden!important}
.nearby-map,.map-container,.leaflet-container{min-height:360px;height:clamp(360px,46vw,520px)!important;max-height:520px!important}
.leaflet-container{background:#edf1ec!important}

/* Admin keeps the same visual language but denser */
.admin-page,.admin-wrap,.admin-container{background:transparent!important}
.admin-page .card,.admin-wrap .card,.admin-card{border-radius:18px!important}

.admin-page td,.admin-wrap td{font-size:12px!important}

  .about-feature-grid,.about-features-grid,.intro-feature-grid,.intro-features-grid,.feature-grid,.service-grid{grid-template-columns:1fr!important;gap:12px!important}
  .about-feature-grid>*,.about-features-grid>*,.intro-feature-grid>*,.intro-features-grid>*,.feature-grid>*,.service-grid>*{min-height:0!important;padding:18px!important;border-radius:19px!important}
  .home-grid,.dashboard-grid,.quick-grid{grid-template-columns:1fr!important;gap:12px!important}

/* PetGrow unified palette — 2026-08-19
   Visual-only layer: keeps existing behavior/layout logic intact. */

:root{
  --pg-soft-green:#eef6ef;
  --pg-soft-blue:#f1f6fb;
  --pg-soft-peach:#fff5ed;
  --pg-soft-lilac:#f7f2fb;
  --pg-soft-cream:#fff9ec;
  --pg-soft-rose:#fff2f4;
  --pg-soft-mint:#eef8f5;
  --pg-soft-border:#dfe8e1;
  --pg-soft-ink:#2c3a31;
  --pg-soft-sub:#718078;
  --pg-soft-shadow:0 10px 28px rgba(39,62,45,.055);
}

/* Global page canvas */
body{background:linear-gradient(180deg,#fbfcfa 0%,#f7faf7 56%,#fffaf7 100%)!important;color:var(--pg-soft-ink)!important}
.petgrow-content-stage,.legal-page-shell,.feature-module-shell,.petmusic-page,.petnews-v10,.mypage-shell,.nearby-page{color:var(--pg-soft-ink)!important}

/* Shared hero/card language */
.petgrow-unified-hero{
  background:linear-gradient(135deg,#f0f8f1 0%,#f7fbf7 56%,#fff8ed 100%)!important;
  border-color:#dbe7dd!important;
  box-shadow:0 12px 30px rgba(42,66,49,.055)!important;
}
.bg-card,.bg-surface-card{
  border-color:var(--pg-soft-border)!important;
  box-shadow:var(--pg-soft-shadow)!important;
}
.bg-card{background:#fff!important}
.bg-surface-card{background:#f8fbf8!important}
.bg-sub{color:var(--pg-soft-sub)!important}

/* Common controls */
.bg-chip{
  border-color:#d9e5dc!important;
  background:#fff!important;
  color:#4d6c56!important;
}
.bg-chip:hover{background:#eff6f0!important;border-color:#c6d9ca!important;color:#356a43!important}
.bg-chip.active{background:#e8f3ea!important;border-color:#bfd6c4!important;color:#306440!important}

.bg-input{background:#fff!important;border-color:#dfe7e1!important;color:#2d3a32!important}

.pg-oracle-shell:before,.pet-tarot-shell:before{
  content:"";
  position:absolute;
  inset:-10px;
  z-index:-1;
  pointer-events:none;
  border-radius:32px;
  background:
    radial-gradient(circle at 8% 3%,rgba(116,190,147,.11),transparent 26%),
    radial-gradient(circle at 92% 8%,rgba(202,167,90,.10),transparent 24%);
}
.pg-oracle-flow{
  display:grid;
  grid-template-columns:auto minmax(18px,1fr) auto minmax(18px,1fr) auto;
  align-items:center;
  width:min(100%,560px);
  margin:0 auto 24px;
  color:#7b8a82;
  font:800 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.1em;
}
.pg-oracle-flow span{white-space:nowrap}
.pg-oracle-flow span.active{color:var(--oracle-emerald)}
.pg-oracle-flow i{
  position:relative;
  height:1px;
  margin:0 10px;
  overflow:hidden;
  background:var(--oracle-line);
}
.pg-oracle-flow i:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,var(--oracle-emerald),transparent);
  transform:translateX(-110%);
  animation:pgOracleSignal 2.4s ease-in-out infinite;
}
.pg-oracle-flow i:nth-of-type(2):after{animation-delay:.7s}
@keyframes pgOracleSignal{0%,24%{transform:translateX(-110%)}65%,100%{transform:translateX(110%)}}

.pg-oracle-card,
.pg-oracle-compat>.bg-card{
  border:1px solid var(--oracle-line)!important;
  border-radius:28px!important;
  background:
    linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.94)),
    repeating-linear-gradient(90deg,transparent 0,transparent 31px,rgba(35,106,77,.045) 32px),
    repeating-linear-gradient(0deg,transparent 0,transparent 31px,rgba(35,106,77,.045) 32px)!important;
  box-shadow:0 22px 60px rgba(21,61,45,.09)!important;
}
.pg-oracle-menu>.pg-oracle-flow{margin-bottom:18px}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card{
  position:relative;
  overflow:hidden;
  min-height:102px;
  border:1px solid var(--oracle-line)!important;
  background:linear-gradient(110deg,#fff 0%,#f6faf7 100%)!important;
  box-shadow:0 10px 26px rgba(24,65,48,.055)!important;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease!important;
}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card:before{
  content:"";
  position:absolute;
  left:0;top:18px;bottom:18px;
  width:3px;
  border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--oracle-emerald),#8bc9a4);
}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card:nth-child(2):before{background:linear-gradient(#caa75a,#ead69c)}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card:nth-child(3):before{background:linear-gradient(#345b78,#82abc4)}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card:nth-child(4):before{background:linear-gradient(#8a5f78,#c99aad)}
.pg-oracle-menu [style*="display: grid"]>.bg-surface-card:hover{
  transform:translateY(-2px);
  border-color:rgba(35,106,77,.3)!important;
  box-shadow:0 16px 34px rgba(24,65,48,.09)!important;
}

.pg-oracle-saju-result{padding-top:2px}
.pg-oracle-saju-result [style*="flex-direction: column"]>.bg-surface-card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--oracle-line)!important;
  border-radius:20px!important;
  background:linear-gradient(135deg,#fff,#f7faf8)!important;
  box-shadow:0 9px 26px rgba(24,65,48,.05)!important;
}
.pg-oracle-saju-result [style*="flex-direction: column"]>.bg-surface-card:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:3px;
  background:linear-gradient(90deg,var(--oracle-emerald),#8bc9a4 58%,var(--oracle-gold));
}

.pg-oracle-fortune .pet-daily-orb{
  position:relative;
  background:radial-gradient(circle,#fff7cf 0 35%,#dff1e7 36% 58%,transparent 59%)!important;
  filter:drop-shadow(0 12px 18px rgba(35,106,77,.12));
  animation:pgOracleFloat 3s ease-in-out infinite;
}
.pg-oracle-save-state{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  margin-top:18px;
  border:1px solid var(--oracle-line);
  border-radius:999px;
  color:#65776d;
  background:#f7faf8;
  font-size:11px;
  font-weight:800;
}
.pg-oracle-save-state.saved{color:var(--oracle-emerald);background:#eff8f2}
.pg-oracle-save-state.saved:before{content:"✓";margin-right:6px}
.pg-oracle-save-state button{border:0;background:none;color:#a3483f;font:inherit;cursor:pointer}
@keyframes pgOracleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.pet-tarot-shell .pet-tarot-stage{border-color:var(--oracle-line)!important}
.pet-tarot-shell .pet-tarot-stage:before{
  background:
    linear-gradient(90deg,transparent 49.85%,rgba(35,106,77,.035) 50%,transparent 50.15%),
    radial-gradient(circle at 50% 0,rgba(202,167,90,.13),transparent 34%)!important;
}
.pet-tarot-shell .pet-tarot-topic{
  border-color:var(--oracle-line)!important;
  background:linear-gradient(110deg,#fff,#f5faf7)!important;
}
.pet-tarot-shell .pet-tarot-reading-detail section{
  border-color:var(--oracle-line)!important;
  background:linear-gradient(145deg,#fff,#f7faf8)!important;
}
.pet-tarot-shell .pet-tarot-reading-detail h4{color:var(--oracle-emerald)!important}

@media(max-width:680px){
  .pg-oracle-flow{margin-bottom:18px;font-size:8.5px;letter-spacing:.07em}
  .pg-oracle-flow i{margin:0 6px}
  .pg-oracle-card,.pg-oracle-compat>.bg-card{border-radius:22px!important}
  .pg-oracle-menu [style*="display: grid"]>.bg-surface-card{min-height:94px}
}
@media(prefers-reduced-motion:reduce){
  .pg-oracle-flow i:after,.pg-oracle-fortune .pet-daily-orb{animation:none!important}
  .pg-oracle-menu [style*="display: grid"]>.bg-surface-card{transition:none!important}
}

/* PetGrow color harmony — shared brand family across core, About and Pet Places. */
:root{
  --pg-harmony-ink:#223027;
  --pg-harmony-sub:#68736b;
  --pg-harmony-deep:#234f3c;
  --pg-harmony-green:#315f49;
  --pg-harmony-mid:#4f8a5b;
  --pg-harmony-soft:#edf5ee;
  --pg-harmony-paper:#f8faf7;
  --pg-harmony-line:#e2e9e3;
  --pg-harmony-highlight:#ddefcb;
}

/* Keep the established light/dark green hierarchy available to legacy views. */
.bboggl-root{
  --primary:var(--pg-harmony-mid)!important;
  --primary-dark:var(--pg-harmony-green)!important;
  --text:var(--pg-harmony-ink)!important;
  --sub:var(--pg-harmony-sub)!important;
  --bg:var(--pg-harmony-paper)!important;
  --surface:#f1f5f1!important;
  --border:var(--pg-harmony-line)!important;
}

/* About and Pet Places were introduced with different one-off forest greens. */
.pg-about-next{
  --about-ink:var(--pg-harmony-ink);
  --about-green:var(--pg-harmony-deep);
  --about-lime:var(--pg-harmony-highlight);
  --about-line:var(--pg-harmony-line);
  --about-paper:var(--pg-harmony-paper);
}
.pg-place-next{
  --place-ink:var(--pg-harmony-ink);
  --place-green:var(--pg-harmony-green);
  --place-green-2:var(--pg-harmony-mid);
  --place-mint:var(--pg-harmony-soft);
  --place-line:var(--pg-harmony-line);
}

/* The home shortcuts used unrelated purple, blue, orange and pink tints.
   Retain gentle variation while keeping every card in one green-neutral family. */
.petgrow-dashboard-home .dash-quick-grid>button:nth-child(3n+1){
  background:linear-gradient(145deg,#fff,var(--pg-harmony-soft))!important;
  border-color:#dbe8dd!important;
}
.petgrow-dashboard-home .dash-quick-grid>button:nth-child(3n+2){
  background:linear-gradient(145deg,#fff,#f4f8f4)!important;
  border-color:var(--pg-harmony-line)!important;
}
.petgrow-dashboard-home .dash-quick-grid>button:nth-child(3n){
  background:linear-gradient(145deg,#fff,#f8faf7)!important;
  border-color:var(--pg-harmony-line)!important;
}
.petgrow-dashboard-home .dash-quick-grid>button i,
.petgrow-dashboard-home .dash-widget-icon,
.more-menu-card i{
  background:var(--pg-harmony-soft)!important;
  border-color:#dbe8dd!important;
  color:var(--pg-harmony-green)!important;
}

/* Home info, music and news rows used the same blue/orange striping as the old
   shortcut grid. Bring them into the shared family as well. */
.petgrow-dashboard-home .dash-section>div[style*="display: grid"]>.bg-card:nth-child(3n+1){
  background:#f2f7f3!important;
  border-color:#dbe8dd!important;
}
.petgrow-dashboard-home .dash-section>div[style*="display: grid"]>.bg-card:nth-child(3n+2){
  background:#f7faf7!important;
  border-color:var(--pg-harmony-line)!important;
}
.petgrow-dashboard-home .dash-section>div[style*="display: grid"]>.bg-card:nth-child(3n){
  background:#edf5ee!important;
  border-color:#d9e6dc!important;
}
.petgrow-dashboard-home .home-music-row.is-playing{
  background:linear-gradient(90deg,#e6f2e8,#f8fbf8)!important;
  border-color:#a9c8ae!important;
}

/* The profile control is part of the shell, not a semantic status indicator. */
.petgrow-dashboard-home .dash-profile-dot{
  background:var(--pg-harmony-soft)!important;
  border-color:#d6e5d9!important;
  color:var(--pg-harmony-green)!important;
}

/* Preserve warning, error, success and third-party brand colors. */
/* 카테고리 탐색은 모든 화면에서 읽기 좋은 한 줄 가로 스크롤로 통일합니다. */
.category-one-row .responsive-category-desktop,
.category-one-row .responsive-category-primary,
.petnews-cats,
.petmusic-tabs,
.tab-bar,
.cm-filter-wrap {
  display: flex !important;
  flex-wrap: nowrap !important;
  gap: 8px !important;
  width: 100%;
  max-width: 100%;
  overflow-x: auto !important;
  overflow-y: hidden;
  padding: 2px 2px 8px !important;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.category-one-row .responsive-category-desktop::-webkit-scrollbar,
.category-one-row .responsive-category-primary::-webkit-scrollbar,
.petnews-cats::-webkit-scrollbar,
.petmusic-tabs::-webkit-scrollbar,
.tab-bar::-webkit-scrollbar,
.cm-filter-wrap::-webkit-scrollbar { display: none; }

.category-one-row .bg-chip,
.petnews-cats button,
.petmusic-tabs button,
.tab-bar > *,
.cm-filter-wrap > * {
  flex: 0 0 auto !important;
  white-space: nowrap !important;
  scroll-snap-align: start;
}

/* 펫위치도 같은 한 줄 규칙을 사용하되 아이콘과 글자를 나란히 표시합니다. */
.nearby-category-grid {
  display: flex !important;
  flex-wrap: nowrap !important;
  gap: 7px !important;
  max-width: 100%;
  overflow-x: auto !important;
  overflow-y: hidden;
  margin: 0 0 12px !important;
  padding: 2px 2px 8px !important;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.nearby-category-grid::-webkit-scrollbar { display: none; }
.nearby-category-grid button {
  flex: 0 0 auto !important;
  min-height: 44px !important;
  flex-direction: row !important;
  gap: 6px !important;
  padding: 0 14px !important;
  border-radius: 999px !important;
}
.nearby-category-grid button span { font-size: 1rem !important; }
.nearby-category-grid button b { font-size: .8rem !important; }

@media (max-width: 700px) {
  .category-one-row .responsive-category-desktop { display: none !important; }
  .category-one-row .responsive-category-mobile { display: block !important; }
  .category-one-row .responsive-category-primary { display: flex !important; grid-template-columns: none !important; }
  .nearby-category-grid { margin-inline: 12px !important; }
}

/* A calm, readable mobile experience for the three oracle services. */
.pg-oracle-shell,.pet-tarot-shell { min-width:0; --oracle-ink:#173e31; --oracle-emerald:#236a4d; }
.pg-oracle-result-overlay { position:fixed; inset:0; z-index:12000; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(16,34,27,.58); backdrop-filter:blur(8px); }
.pg-oracle-result-dialog { display:flex; flex-direction:column; width:min(760px,100%); max-height:calc(100dvh - 48px); min-height:0; color:#173e31; background:#f6f8f5; border:1px solid rgba(255,255,255,.7); border-radius:28px; box-shadow:0 28px 100px rgba(9,26,19,.3); overflow:hidden; font-family:inherit; }
.pg-oracle-result-header { flex-shrink:0; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:22px 24px 18px; background:#fff; border-bottom:1px solid #e4ebe5; }
.pg-oracle-result-header>div { min-width:0; }
.pg-oracle-result-header small { font-size:10px; letter-spacing:.14em; font-weight:800; color:#698577; }
.pg-oracle-result-header h2 { margin:7px 0 0; font-size:22px; line-height:1.4; letter-spacing:-.035em; overflow-wrap:anywhere; }
.pg-oracle-result-header p { margin:5px 0 0; font-size:14px; color:#607468; overflow-wrap:anywhere; }
.pg-oracle-close { display:grid; place-items:center; flex-shrink:0; width:44px; height:44px; border:1px solid #dde7df; border-radius:50%; color:#234c3a; background:#f4f7f3; font-family:inherit; font-size:28px!important; font-weight:400; line-height:1; cursor:pointer; }
.pg-oracle-result-scroll { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:24px; scrollbar-gutter:stable; -webkit-overflow-scrolling:touch; overflow-wrap:anywhere; }
.pg-oracle-result-footer { flex-shrink:0; display:flex; gap:10px; padding:14px 24px max(16px,env(safe-area-inset-bottom)); border-top:1px solid #e4ebe5; background:#fff; }
.pg-oracle-result-footer .bg-btn { flex:1; min-width:0; min-height:48px; height:auto; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.4; box-shadow:none; }
.pg-oracle-result-dialog .pg-oracle-flow { display:none; }
.pg-oracle-result-dialog .feature-module-shell { width:100%; max-width:none; padding:0; margin:0; }
.pg-oracle-result-dialog .bg-card { box-shadow:none!important; }
.pg-oracle-result-dialog .pet-user-name { overflow-wrap:anywhere; white-space:normal!important; }
.pg-oracle-result-error { margin:16px 0 0; padding:14px; border:1px solid #efc8bd; border-radius:12px; background:#fff3ef; color:#943e2d; font-size:14px; line-height:1.6; }
.pg-oracle-result-dialog .pet-tarot-result-wrap { margin:0!important; padding:20px!important; gap:20px!important; border-radius:20px!important; grid-template-columns:150px minmax(0,1fr)!important; border:1px solid #e2e8de!important; }
.pg-oracle-result-dialog .pet-tarot-face { width:150px; max-width:100%; height:228px; margin:0 auto; border-radius:16px; }
.pg-oracle-result-dialog .pet-tarot-reading { min-width:0; }
.pg-oracle-result-dialog .pet-tarot-reading p,.pg-oracle-result-dialog .pet-tarot-reading-detail p { font-size:15px!important; line-height:1.85!important; color:#445d4e; word-break:normal; overflow-wrap:anywhere; }
.pg-oracle-result-dialog .pet-tarot-reading-detail { grid-template-columns:1fr!important; gap:12px; }
.pg-oracle-result-dialog .pet-tarot-reading-detail h4 { font-size:15px!important; }
.pg-oracle-result-dialog .pet-tarot-reading-detail section { padding:16px!important; background:#f7faf6!important; }
.pg-oracle-result-dialog .pet-tarot-result-topic { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; line-height:1.6; }
.pg-oracle-result-dialog .pet-tarot-result-topic span { flex-basis:100%; font-size:12px; color:#6b7c6f; }
.pg-oracle-result-dialog .pet-tarot-once-note { font-size:12px; line-height:1.7; color:#6b7c6f; margin:16px 0 0; }
.pg-oracle-result-dialog .pet-tarot-back-link { min-height:44px; }
.pg-oracle-result-dialog .pet-daily-fortune-card { padding:26px 20px!important; border-radius:20px!important; }
.pg-oracle-result-dialog .pet-daily-fortune-card h2 { font-size:24px!important; line-height:1.5!important; }
.pg-oracle-result-dialog .pet-daily-fortune-card>p { font-size:17px!important; line-height:1.9!important; text-align:left; }
.pg-oracle-result-dialog .pg-oracle-save-state { padding:10px 14px; height:auto; border-radius:12px; font-size:12px; }
.pg-oracle-result-open .modal-overlay { z-index:13000!important; padding:16px!important; }
.pg-oracle-share-card { max-height:calc(100dvh - 32px)!important; overflow-y:auto!important; overscroll-behavior:contain; padding:20px!important; border-radius:20px!important; }

.pg-oracle-share-card .bg-btn { min-height:48px; }

  .pg-oracle-menu .bg-surface-card>span:nth-child(2) { flex:1; min-width:0; }
  .pg-oracle-menu .bg-surface-card strong { font-size:17px!important; }

  .pet-tarot-shell .pet-tarot-topic em { font-size:12px!important; }
  .pet-tarot-shell .pet-tarot-deck22 { grid-template-columns:repeat(4,minmax(0,1fr))!important; gap:10px!important; padding:16px 0!important; }
  .pet-tarot-shell .pet-tarot-back22 { min-width:44px; min-height:80px!important; border-radius:12px!important; }
  .pet-tarot-shell .pet-tarot-back22 b { font-size:9px!important; }
  .pet-tarot-shell .pet-tarot-back22:hover { transform:none!important; }
  .pet-tarot-shell .pet-tarot-intro { font-size:14px!important; line-height:1.75!important; }
  .pg-oracle-saju-result h2 { font-size:24px!important; }
  .pg-oracle-saju-result .bg-surface-card { padding:18px!important; border-radius:18px!important; }
  .pg-oracle-saju-result .bg-surface-card>div:first-child { font-size:16px!important; }
  .pg-oracle-saju-result .bg-surface-card>div:last-child { font-size:15px!important; line-height:1.9!important; }

4\uC9C0 \uC54A\uACE0 '\uCE74\uCE74\uC624\uB85C \uC2DC\uC791\uD558\uAE30'\uB85C \uC774\uC6A9\uD560 \uC218 \uC788\uC73C\uBA70, \uB85C\uADF8\uC778\uD55C \uACC4\uC815 \uAE30\uC900\uC73C\uB85C \uC800\uC7A5 \uAE30\uB2A5\uACFC \uB0B4 \uD65C\uB3D9\uC774 \uC5F0\uACB0\uB3FC\uC694."},{title:"\uC6B0\uB9AC \uC544\uC774 \xB7 \uC131\uC7A5 \uAE30\uB85D",body:"\uAC15\uC544\uC9C0\uC640 \uACE0\uC591\uC774\uB97C \uC5EC\uB7EC \uB9C8\uB9AC \uB4F1\uB85D\uD558\uACE0 \uC544\uC774\uBCC4 \uD504\uB85C\uD544, \uD604\uC7AC \uCCB4\uC911, \uC131\uC7A5 \uAE30\uB85D, \uC131\uC7A5 \uADF8\uB798\uD504\uC640 \uC131\uC7A5\uC568\uBC94\uC744 \uAD00\uB9AC\uD560 \uC218 \uC788\uC5B4\uC694. \uB2E4\uB978 \uAE30\uAE30\uC5D0\uC11C\uB3C4 \uAC19\uC740 \uACC4\uC815\uC73C\uB85C \uB85C\uADF8\uC778\uD558\uBA74 \uC800\uC7A5\uB41C \uC815\uBCF4\uB97C \uC774\uC5B4\uC11C \uBCFC \uC218 \uC788\uC5B4\uC694."},{title:"PetBTI",body:"\uAC15\uC544\uC9C0\uC640 \uACE0\uC591\uC774 \uAC01\uAC01 20\uAC1C\uC758 \uAD6C\uCCB4\uC801\uC778 \uD589\uB3D9 \uC9C8\uBB38\uC5D0 \uB2F5\uD558\uBA74 \uC6B0\uB9AC \uC544\uC774\uC758 \uC131\uD5A5\uC744 16\uAC00\uC9C0 \uC720\uD615\uC73C\uB85C \uC7AC\uBBF8\uC788\uAC8C \uD655\uC778\uD560 \uC218 \uC788\uC5B4\uC694. \uC644\uB8CC\uD55C \uACB0\uACFC\uB294 \uC800\uC7A5\uD558\uACE0 \uB2E4\uC2DC \uAC80\uC0AC\uD560 \uC218\uB3C4 \uC788\uC5B4\uC694."},{title:"Pet\uC0AC\uC8FC",body:"\uB4F1\uB85D\uD55C \uC6B0\uB9AC \uC544\uC774 \uC815\uBCF4\uB97C \uBC14\uD0D5\uC73C\uB85C \uAE30\uBCF8 Pet\uC0AC\uC8FC, \uC624\uB298\uC758 \uD3AB\uC6B4\uC138, \uBCF4\uD638\uC790 \uAD81\uD569\uC744 \uC7AC\uBBF8\uB85C \uC990\uAE38 \uC218 \uC788\uC5B4\uC694. Pet\uD0C0\uB85C\uB294 \uBA54\uC774\uC800 \uC544\uB974\uCE74\uB098 22\uC7A5\uC758 \uC804\uD1B5\uC801\uC778 \uC0C1\uC9D5\uC744 PetGrow\uC2DD \uBC18\uB824\uC0DD\uD65C \uBA54\uC2DC\uC9C0\uB85C \uC7AC\uD574\uC11D\uD558\uBA70, \uAC01 \uC8FC\uC81C\uBCC4\uB85C \uBC18\uB824\uB3D9\uBB3C 1\uB9C8\uB9AC\uB2F9 \uD558\uB8E8 1\uD68C\uB9CC \uBF51\uC744 \uC218 \uC788\uC5B4\uC694. \uC2E4\uC81C \uC131\uACA9\ Track vaccinations with a checklist you can tick off yourself."},{title:"6. Breed info & share cards",body:"Tap the breed name under your pet's name for breed reference info, and use the button above the prediction to create a shareable image card for social media."},{title:"7. Tips",body:"Tap the 'Tips' button in the header to search and bookmark health and lifestyle tips. Today's picks rotate automatically each day."},{title:"8. Managing multiple pets",body:"Switch between dogs and cats with the top tabs, and tap a name chip to switch pets \u2014 up to 10 per species."},{title:"9. Reading the growth chart",body:"The red dot marks your pet's current spot. The green band is a reference healthy range (\xB115% of the prediction) \u2014 stepping outside it adds a vertical line and a warning note to the chart."}],infoGuideTitle:"Guide",infoGuideIntro:"A practical guide to PetGrow's main menus and features, organized around the actual app flow.",infoGuideSections:[{title:"Home dashboard",body:"Use the home dashboard to jump quickly to My Pets, Pet Music, Nearby Pet, PetTalk, PetBTI and other frequently used features. The layout adapts automatically for web, mobile and app screens."},{title:"Kakao Login",body:"Sign in with your Kakao account without creating a separate password. Saved features and activity are linked to the signed-in account."},{title:"My Pets & growth records",body:"Register multiple dogs and cats and manage each pet's profile, weight records, growth chart and growth album. Sign in with the same account on another device to continue with saved data."},{title:"PetBTI",body:"Answer 20 detailed behavior questions for dogs or 20 for cats to get a fun 16-type personality result. Results can be saved and the test can be taken again."},{title:"Pet Saju",body:"A light entertainment feature based on your registered pet's information. It is not intended to determine a pet's actual personality or future."},{title:"Pet Info",body:"Browse pet-life information by categories such as dogs, cats, health, lifestyle, food & nutrition, training, safety and grooming. Lists are paginated, searchable and bookmarkable, and content is continuously added and reviewed."},{title:"Pet Music",body:"Play dog and cat music with repeat playback. See the Popular Top 5 and music you have liked, and use likes and comments. You can edit or delete your own comments and report other users' comments."},{title:"Nearby Pet",body:"Allow location access to find nearby animal hospitals, pharmacies, pet shops, groomers, daycare and hotels sorted by distance. See your location and business locations on the map together with business name, category, address, phone number and distance. Signed-in users can leave ratings, reviews and likes; their own reviews can be edited or deleted and other reviews can be reported. Your coordinates are used only for nearby search and are not saved to your account."},{title:"PetTalk",body:"Share pet-life stories in categories such as daily life, bragging, questions, health, information, walks, training, product recommendations and free chat. Users can like posts and comments; their own posts and comments can be edited or deleted, while other content can be reported."},{title:"Account & My Activity",body:"Manage your nickname and account details, and review account-based activity such as your PetTalk activity and Pet Music likes."},{title:"Customer Support",body:"Check notices, public feedback, your inquiries and the inquiry form. If public sharing is unchecked, the inquiry is visible only to the operations team."},{title:"Admin Center",body:"Visible only to authorized admin accounts. It includes menu usage analytics, web/mobile web/PWA/app platform statistics, reports and moderation tools, Pet Music management, and daily, weekly and monthly reports."},{title:"Log out & delete account",body:"Logging out keeps saved account data on the server. Account deletion processes account-linked pet data, saved results and user-created content as described in the privacy policy, except data that must be retained by law, and deleted data cannot be restored."}],migrationTitle:"Looks like you had pets registered before \u{1F43E}",migrationBody:"Want to save this to your PetGrow account? Once saved, you can pick up right where you left off on any device.",migrationLater:"Later",migrationConfirm:"Save to my account",migrationSaving:"Saving...",deleteAccountPageTitle:"Delete Account",deleteAccountPageBody:"Deleting your account removes the data below, except information that must be separately retained under applicable law. This cannot be undone.",deleteAccountItems:["Your PetGrow account and Kakao authentication link","Registered pet information and profile photos","Saved data such as growth records","PetBTI results","Your Pet Talk posts, comments, likes, and attached photos","Other data linked to your account and your login session"],deleteAccountLoggedInAs:e=>`You're currently logged in as ${e}.`,deleteAccountNeedLogin:"Please log in with Kakao first to delete your account.",deleteAccountEmailFallback:"If you can't log in with Kakao, email help.petgrow@gmail.com and we'll take care of it for you.",deleteAccountConfirmTitle:"Are you sure you want to delete your account?",deleteAccountConfirmBody:"Deleting your account removes your PetGrow account, pet information and profile photos, growth records, PetBTI results, PetTalk posts, comments, likes, attached photos, and other account-linked data. This cannot be undone. Do you want to continue?",deleteAccountDoneTitle:"Your account has been deleted",deleteAccountDoneBody:"Thank you for using PetGrow. Your account and all related data have been deleted.",speciesLabel:{dog:"dog",cat:"cat"},adultWord:{dog:"adult dog",cat:"adult cat"},otherLabel:{dog:"breed",cat:"breed"},mixLabel:{dog:"Mixed breed (based on parents)",cat:"Mixed breed (unknown)"},customLabel:e=>`${e} not listed (enter manually)`,searchPlaceholder:(e,t)=>`Search ${e} (e.g. ${t})`,searchExample:{dog:"Ma uAD6C\uB97C \uB9CC\uB098\uBA74 \uC870\uC2EC\uC2A4\uB7FD\uAC8C \uAC70\uB9AC\uB97C \uC7AC\uB2E4\uAC00, \uC0C1\uB300\uAC00 \uD3B8\uC548\uD558\uB2E4\uACE0 \uB290\uAEF4\uC9C0\uBA74 \uAE08\uBC29 \uB9C8\uC74C\uC744 \uC5EC\uB294 \uD3B8\uC774\uC5D0\uC694.","\uD63C\uC790 \uB178\uB294 \uAC83\uB3C4 \uC88B\uC544\uD558\uC9C0\uB9CC \uB9C8\uC74C \uB9DE\uB294 \uCE5C\uAD6C\uAC00 \uC0DD\uAE30\uBA74 \uAECC\uB531\uC9C0\uCC98\uB7FC \uBD99\uC5B4\uB2E4\uB2C8\uB294 \uC2A4\uD0C0\uC77C\uC774\uB77C, \uB2E8\uC9DD\uC774 \uC0DD\uAE30\uBA74 \uC6B0\uC815\uC774 \uC544\uC8FC \uAE4A\uC5B4\uC9C8 \uC544\uC774\uC608\uC694.","\uB610\uB798 \uCE5C\uAD6C\uB4E4 \uC0AC\uC774\uC5D0\uC11C \uC778\uAE30\uAC00 \uB9CE\uC744 \uC0C1\uC774\uC5D0\uC694. \uD2B9\uC720\uC758 \uBD99\uC784\uC131 \uB355\uBD84\uC5D0 \uC5B4\uB514\uC11C\uB4E0 \uAE08\uBC29 \uCE5C\uAD6C\uB97C \uC0AC\uADC8 \uC218 \uC788\uC5B4\uC694."],food:e=>["\uAC04\uC2DD \uB0C4\uC0C8\uB97C \uB9E1\uB294 \uC21C\uAC04 \uB208\uBE5B\uBD80\uD130 \uB2EC\uB77C\uC9C0\uB294 \uD0C0\uC785\uC774\uC5D0\uC694. \uD3C9\uC18C\uC5D4 \uC58C\uC804\uD558\uB2E4\uAC00\uB3C4 \uAC04\uC2DD \uC55E\uC5D0\uC11C\uB294 \uC138\uC0C1 \uC9C4\uC9C0\uD574\uC9C0\uB294 \uBC18\uC804 \uB9E4\uB825\uC774 \uC788\uC5B4\uC694 \u{1F356}","\uBA39\uC744 \uBCF5\uC774 \uC544\uC8FC \uAC15\uD55C \uD3B8\uC774\uC5D0\uC694. \uBC25\uADF8\uB987 \uC55E\uC5D0\uC11C\uB294 \uADF8 \uB204\uAD6C\uBCF4\uB2E4 \uC9D1\uC911\uB825\uC774 \uC88B\uC544\uC9C0\uACE0, \uC5B4\uCA4C\uBA74 \uC740\uADFC\uC2AC\uCA4D \uAC04\uC2DD\uC744 \uB354 \uC5BB\uC5B4\uB0B4\uB294 \uC794\uAE30\uC220\uB3C4 \uC788\uC744\uC9C0 \uBAB0\uB77C\uC694.","\uB9DB\uC788\uB294 \uAC78 \uBCF4\uBA74 \uBABB \uCC38\uB294 \uD3B8\uC774\uB77C, \uC2DD\uD0D0\uC774 \uC788\uB2E4\uAE30\uBCF4\uB2E4\uB294 '\uC778\uC0DD\uC744 \uB9DB\uC788\uAC8C \uC990\uAE38 \uC904 \uC544\uB294 \uC544\uC774'\uB77C\uACE0 \uBD10\uC8FC\uC138\uC694 \u{1F60B}","\uC758\uC678\uB85C \uC785\uC774 \uC9E7\uC544\uC11C \uC88B\uC544\uD558\uB294 \uAC83\uB9CC \uCF55 \uC9D1\uC5B4 \uBA39\uB294 \uBBF8\uC2DD\uAC00 \uC2A4\uD0C0\uC77C\uC77C \uC218 \uC788\uC5B4\uC694. \uADF8\uB798\uB3C4 \uC88B\uC544\uD558\uB294 \uAC04\uC2DD \uC55E\uC5D0\uC11C\uB294 \uB208\uBE5B\uC774 \uBC18\uC9DD\uC77C \uAC70\uC608\uC694.","\uC2DD\uC0AC \uC2DC\uAC04\uC774 \uB418\uBA74 \uC81C\uC77C \uBA3C\uC800 \uC54C\uC544\uCC44\uACE0 \uBCF4\uD638\uC790 \uACC1\uC744 \uB9F4\uB3C4\uB294 \uD0C0\uC785\uC774\uC5D0\uC694. \uBC30\uACE0\uD514\uC744 \uD2F0\uB0B4\uB294 \uAC83\uB3C4 \uC774 \uC544\uC774\uB9CC\uC758 \uC560\uAD50 \uD3EC\uC778\uD2B8\uC608\uC694."],play:e=>["\uBAB8\uC744 \uC6C0\uC9C1\uC774\uB294 \uB180\uC774\uB97C \uC88B\uC544\uD574\uC11C, \uACF5\uB180\uC774\uB098 \uB6F0\uC5B4\uB2E4\uB2C8\uB294 \uD65C\uB3D9\uC744 \uD558\uBA74 \uB208\uC5D0 \uB744\uAC8C \uC2E0\uB098 \uD574\uC694. \uC0B0\uCC45\uC774\uB098 \uD65C\uB3D9\uB7C9\uC774 \uBD80\uC871\uD558\uBA74 \uC2A4\uD2B8\uB808\uC2A4\uAC00 \uC313\uC77C \uC218 \uC788\uC73C\uB2C8 \uC2E0\uACBD \uC368\uC8FC\uC138\uC694.","\uC870\uC6A9\uD788 \uC549\uC544\uC11C \uD558\uB294 \uB180\uC774\uB3C4 \uC740\uADFC\uD788 \uC88B\uC544\uD558\uB294 \uD3B8\uC774\uB77C, \uC7A5\uB09C\uAC10 \uD558\uB098\uB97C \uBB3C\uACE0 \uC624\uB7AB\uB3D9\uC548 \uD63C\uC790\uC11C\uB3C4 \uC798 \uB180\uC544\uC694.","\uC0B0\uCC45 \uB098\uAC00\uB294 \uAC78 \uC138\uC0C1\uC5D0\uC11C \uC81C\uC77C \uC88B\uC544\uD558\uB294 \uD0C0\uC785\uC77C \uAC00\uB2A5\uC131\uC774 \uB192\uC544\uC694. \uD604\uAD00 \uADFC\uCC98\uC5D0\uC11C \uBAA9\uC904\uC774\uB098 \uC2E0\uBC1C \uC18C\uB9AC\uB9CC \uB098\uB3C4 \uBC18\uC751\uD560 \uAC70\uC608\uC694.","\uC0C8\uB85C\uC6B4 \uC7A5\uB09C\uAC10\uC5D0 \uB300\uD55C \uD638\uAE30\uC2EC\uC774 \uCEE4\uC11C, \uCC98\uC74C \uBCF4\uB294 \uBB3C\uAC74\uC740 \uC77C\uB2E8 \uD0D0\uC0C9\uBD80\uD130 \uD558\uACE0 \uBCF4\uB294 \uC2A4\uD0C0\uC77C\uC774\uC5D0\uC694.","\uB180\uC774 \uC911\uC5D0 \uAC11\uC790\uAE30 \uC815\uC0C9\uD558\uACE0 \uC9C4\uC9C0\uD574\uC9C0\uB294 \uBC18\uC804 \uB9E4\uB825\uC774 \uC788\uC5B4\uC694. \uB178\uB294 \uAC83\uB3C4 \uC9C4\uC2EC\uC73C\uB85C \uC784\uD558\uB294 \uD0C0\uC785\uC774\uB784\uAE4C\uC694 \u{1F606}"],affection:e=>["\uC560\uAD50\uAC00 \uC740\uADFC\uD558\uC9C0\uB9CC \uD655\uC2E4\uD55C \uC2A4\uD0C0\uC77C\uC774\uC5D0\uC694. \uB300\uB193\uACE0 \uD45C\uD604\uD558\uAE30\uBCF4\uB2E4\uB294, \uC2AC\uCA4D \uB2E4\uAC00\uC640 \uBAB8\uC744 \uAE30\uB300\uB294 \uAC78\uB85C \uB9C8\uC74C\uC744 \uC804\uD560 \uAC00\uB2A5\uC131\uC774 \uB192\uC544\uC694.","\uBCF4\uD638\uC790\uAC00 \uB2E4\uB978 \uACF3\uC5D0 \uC815\uC2E0\uC774 \uD314\uB824 \uC788\uC73C\uBA74 \uC2AC\uCA4D \uC606\uC73C\uB85C \uC640\uC11C \uC874\uC7AC\uAC10\uC744 \uC5B4\uD544\uD558\uB294 \uAC83\uB3C4 \uC774 \uC544\uC774\uB9CC\uC758 \uC560\uC815 \uD45C\uD604\uC77C \uC218 \uC788\uC5B4\uC694.","\uC2A4\uD0A8\uC2ED\uC744 \uC544\uC8FC \uC88B\uC544\uD574\uC11C, \uC4F0\uB2E4\uB4EC\uC5B4\uC8FC\uB294 \uC190\uAE38 \uC55E\uC5D0\uC11C\uB294 \uC138\uC0C1 \uD589\uBCF5\uD55C \uD45C\uC815\uC744 \uC9C0\uC744 \uAC70\uC608\uC694.","\uC560\uAD50\uAC00 \uD3ED\uBC1C\uC801\uC778 \uD0C0\uC785\uC774\uB77C, \uBCF4\uD638\uC790\uAC00 \uC9D1\uC5D0 \uB4E4\uC5B4\uC624\uB294 \uC21C\uAC04 \uC628\uBAB8\uC73C\uB85C \uBC18\uAC00\uC6C0\uC744 \uD45C\uD604\uD560 \uAC00\uB2A5\uC131\uC774 \uB192\uC544\uC694.","\uBB34\uC2EC\uD55C \uB4EF \uBCF4\uC774\uC9C0\uB9CC \uC0AC\uC2E4\uC740 \uBCF4\uD638\uC790\uC758 \uAD00\uC2EC\uC744 \uC740\uADFC\uD788 \uC6D0\uD558\uB294 \uCE24\uB370\uB808 \uC2A4\uD0C0\uC77C\uC774\uC5D0\uC694."],mischief:e=>["\uC870\uC6A9\uD558\uB2E4 \uC2F6\uC73C\uBA74 \uBB54\uAC00 \uC7AC\uBBF8\uC788\uB294 \uC77C\uC744 \uACC4\uD68D\uD558\uACE0 \uC788\uC744\uC9C0\uB3C4 \uBAB0\uB77C\uC694 \u{1F440} \uC2EC\uC2EC\uD560 \uB54C \uD2B9\uD788 \uC7A5\uB09C\uAE30\uAC00 \uBC1C\uB3D9\uD558\uB294 \uD0C0\uC785\uC774\uC5D0\uC694.","\uBCF4\uD638\uC790\uAC00 \uC548 \uBCF4\uB294 \uD2C8\uC744 \uADC0\uC2E0\uAC19\uC774 \uC54C\uC544\uCC44\uB294 \uB208\uCE58\uC758 \uC544\uC774\uC608\uC694. \uADF8 \uD2C8\uC744 \uD0C0 \uC791\uC740 \uC7A5\uB09C\uC744 \uCE60 \uAC00\uB2A5\uC131\uC774 \uB192\uC544\uC694.","\uD638\uAE30\uC2EC\uC774 \uB9CE\uC544\uC11C \uC0C8\uB85C\uC6B4 \uBB3C\uAC74\uC774 \uC0DD\uAE30\uBA74 \uC77C\uB2E8 \uD655\uC778\uBD80\uD130 \uD558\uACE0 \uBCF4\uB294 \uC2B5\uC131\uC774 \uC788\uC5B4\uC694. \uAC00\uB054 \uADF8\uAC8C \uC7A5\uB09C\uC73C\uB85C \uC774\uC5B4\uC9C8 \uC218 \uC788\uC5B4\uC694.","\uD3C9\uC18C\uC5D4 \uC58C\uC804\uD558\uB2E4\uAC00\uB3C4 \uD2B9\uC815 \uC2DC\uAC04\uB300(\uC8FC\uB85C \uC800\uB141 \uBB34\uB835)\uC5D0 \uAC11\uC790\uAE30 \uC5D0\uB108\uC9C0\uAC00 \uD3ED\uBC1C\uD558\uB294 '\uAC1C\uBAA8\uCC28/\uCEA3\uBAA8\uCC28' \uD0C0\uC784\uC774 \uC788\uC744 \uC218 \uC788\uC5B4\uC694.","\uC7A5\uB09C\uAE30 \uC9C0\uC218\uAC00 \uAF64 \uB192\uC740 \uD3B8\uC774\uB77C, \uC2EC\uC2EC\uD568\uC744 \uBABB \uCC38\uACE0 \uC2A4\uC2A4\uB85C \uB180\uAC70\uB9AC\uB97C \uB9CC\uB4E4\uC5B4\uB0B4\uB294 \uCC3D\uC758\uB825\uC774 \uC788\uC5B4\uC694."],luck:e=>["\uC0AC\uB791\uBC1B\uB294 \uBCF5\uC774 \uD2B9\uD788 \uAC15\uD55C \uC544\uC774\uC608\uC694. \uC5B4\uB51C \uAC00\uB4E0 \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uC0AC\uB78C\uB4E4\uC758 \uC2DC\uC120\uACFC \uC560\uC815\uC744 \uB04C\uC5B4\uBAA8\uC73C\uB294 \uB9E4\uB825\uC774 \uC788\uC5B4\uC694.","\uAC74\uAC15 \uBCF5\uC774 \uC88B\uC740 \uD3B8\uC774\uB77C, \uC798 \uCC59\uACA8\uC8FC\uAE30\uB9CC \uD558\uBA74 \uBB34\uB7ED\uBB34\uB7ED \uD2BC\uD2BC\uD558\uAC8C \uC790\uB784 \uAC00\uB2A5\uC131\uC774 \uB192\uC544\uC694.","\uBA39\uC744 \uBCF5\uC774 \uD0C0\uACE0\uB0AC\uC5B4\uC694. \uBC25\uC774\uB4E0 \uAC04\uC2DD\uC774\uB4E0, \uC774 \uC544\uC774 \uC55E\uC5D0\uB294 \uB298 \uB9DB\uC788\uB294 \uAC83\uB4E4\uC774 \uB04A\uC774\uC9C0 \uC54A\uC744 \uAC70\uC608\uC694.","\uCE5C\uAD6C \uBCF5\uC774 \uB9CE\uC544\uC694. \uC0AC\uB78C\uC774\uB4E0 \uB2E4\uB978 \uB3D9\uBB3C \uCE5C\uAD6C\uB4E0, \uC774 \uC544\uC774 \uC8FC\uBCC0\uC5D4 \uC88B\uC740 \uC778\uC5F0\uC774 \uC798 \uBAA8\uC5EC\uC694.","\uBCF4\uD638\uC790 \uBCF5\uC774 \uCD5C\uACE0\uC608\uC694. \uC774\uB807\uAC8C \uC0AC\uB791\uC744 \uB4EC\uBFCD \uC8FC\uB294 \uBCF4\uD638\uC790\uB97C \uB9CC\uB09C \uAC83 \uC790\uCCB4\uAC00 \uC774 \uC544\uC774\uC758 \uAC00\uC7A5 \uD070 \uBCF5\uC77C\uC9C0\uB3C4 \uBAB0\uB77C\uC694 \u{1F495}"]},en:{summaries:e=>["Born to be loved \u2014 total charmer \u{1F495}","Maxed-out curiosity, a little bit of a scaredy-cat \u{1F43E}","The quiet genius who secretly runs the household \u{1F63C}","Once decided, never changes their mind \u{1F4AA}","Loved wherever they go \u2014 natural social star \u2728","Looks chill, but a sensitive soul underneath \u{1F33F}"],personality:e=>[`${e} can be a little shy with new faces, but once the walls come down, few are more affectionate. Give it a few days and you'll find them right by your side.`,"Endlessly curious about new smells and places \u2014 always exploring the world with excitement. That same curiosity can occasionally lead to a bit of mischief too.","Looks tough on the outside but has a soft, sensitive side. Loud noises or new environments can be a bit much, so a calm, gentle voice goes a long way.","Once they set their mind on something, they rarely change it \u2014 call it charming stubbornness rather than difficulty."],bond:e=>["You're the most trusted person in their world. Whatever kind of day it was, seeing you walk through the door seems to melt all of it away.","Affection is shown quietly but clearly \u2014 maybe not dramatic displays, but a habit of staying close and keeping an eye on where you are.","The bond runs deep, and they're surprisingly good at picking up on your mood \u2014 expect extra cuddles on your rough days."],friends:e=>["Enjoys the company of other animals, though they like to size things up carefully at first before warming up.","Has a bit of natural leadership among peers \u2014 often the one starting the games.","A little cautious with strangers at first, but quick to open up once comfortable."],food:e=>["The moment a treat appears, the whole demeanor changes \u2014 food time is serious business \u{1F356}","Blessed with strong food luck \u2014 impressively focused at mealtime, and maybe a little skilled at getting extra treats.","Not exactly picky, more like someone who truly knows how to enjoy a good meal \u{1F60B}"],play:e=>["Loves active play like fetch or running around \u2014 regular exercise really matters for keeping them happy.","Also enjoys quieter play, happily entertained by a favorite toy for a long stretch.","Walks might be their favorite thing in the world \u2014 even the sound of a leash can set off excitement."],affection:e=>["Shows love in quiet but unmistakable ways \u2014 leaning in close says more than words ever could.","If you're distracted, don't be surprised by a gentle nudge reminding you they're there \u2014 that's love too.","A big fan of physical affection \u2014 expect a very happy expression during pets and cuddles."],mischief:e=>["If it's suspiciously quiet, something fun might be brewing \u{1F440} \u2014 mischief tends to strike when bored.","Has an uncanny sense for when you're not looking \u2014 prime time for a little trouble.","New objects get investigated immediately, which occasionally turns into a game."],luck:e=>["Especially blessed with the luck of being loved \u2014 draws attention and affection everywhere they go.","Good health luck \u2014 with proper care, likely to grow up strong and thriving.","Born with food luck \u2014 treats and good meals seem to always find their way to them."]}},Yd={ko:["#\uAECC\uB531\uC9C0","#\uAC04\uC2DD\uB7EC\uBC84","#\uC0AC\uB791\uB465\uC774","#\uD638\uAE30\uC2EC\uB300\uC7A5","#\uC560\uAD50\uD3ED\uBC1C","#\uB69D\uC2EC\uCE90\uB9AD\uD130","#\uC0B0\uCC45\uB7EC\uBC84","#\uB0AF\uAC00\uB9BC\uC8FC\uC758","#\uC778\uC2F8\uAE30\uC9C8","#\uD790\uB9C1\uC694\uC815","#\uC7A5\uB09C\uAFB8\uB7EC\uAE30","#\uC9D1\uC0AC\uBC14\uB77C\uAE30"],en:["#Velcro","#TreatLover","#SweetSoul","#CuriousOne","#AffectionOverload","#GentleStubborn","#WalkFanatic","#ShyAtFirst","#SocialStar","#HealingVibes","#LittleTrouble","#DevotedToYou"]},Rd={ko:["\uC0AC\uB791\uBC1B\uB294 \uBC95\uC744 \uB108\uBB34 \uC798 \uC544\uB294 \uCC9C\uC7AC \uB9C9\uB0B4","\uC628 \uC9D1\uC548\uC75
